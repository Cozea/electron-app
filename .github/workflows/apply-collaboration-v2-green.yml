name: Apply collaboration v2 PR fixes

on:
  push:
    branches:
      - refactor/collaboration-v2-end-to-end
    paths:
      - .github/patches/collaboration-v2-green.patch
      - .github/workflows/apply-collaboration-v2-green.yml

permissions:
  contents: write

concurrency:
  group: apply-collaboration-v2-green
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          ref: refactor/collaboration-v2-end-to-end

      - name: Apply reviewed code patch
        run: |
          git apply --check \
            --exclude=.github/workflows/collaboration-v2-branch-validation.yml \
            .github/patches/collaboration-v2-green.patch
          git apply \
            --exclude=.github/workflows/collaboration-v2-branch-validation.yml \
            .github/patches/collaboration-v2-green.patch

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/desktop/src/features/collaboration/runtime/CollaborationTransport.ts \
            convex/projects.ts \
            tests/architecture/neutralGround.test.ts \
            tests/collaboration/collabWsCatchUp.test.ts \
            tests/devapps/devAppReleaseParts.test.ts \
            tests/identity/convexEndpointAuthority.test.ts \
            tests/projects/projectDeletionCompleteness.test.ts \
            tests/substrate/t3RuntimePreparation.test.ts
          git commit -m 'fix(collaboration): close PR validation gaps'
          git push origin HEAD:refactor/collaboration-v2-end-to-end
