name: Navigation runtime validation

on:
  push:
    branches: [fix/navigation-runtime-v2-completion]
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'shared/**'
      - 'tests/navigation/**'
      - 'tests/electron/navigation/**'
      - 'scripts/perf/navigation/**'
      - '.github/workflows/navigation-runtime-validation.yml'

permissions:
  contents: read

concurrency:
  group: navigation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-main:
    if: >-
      github.event_name == 'push' && github.event.head_commit.message == 'ci(navigation): integrate current main and normalize validation'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/navigation-runtime-v2-completion
          fetch-depth: 0
      - name: Preserve the independently merged computer-use changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-ff --no-commit origin/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [[ "$conflicts" != 'apps/desktop/src/lib/i18n/computerUse.ts' ]]; then
              printf 'Unexpected conflicts; refusing automatic resolution:\n%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs -- apps/desktop/src/lib/i18n/computerUse.ts
            git add apps/desktop/src/lib/i18n/computerUse.ts
          fi
          if [[ -f .git/MERGE_HEAD ]]; then
            git commit -m 'merge: preserve current main computer-use runtime in navigation repair'
            git push origin HEAD:fix/navigation-runtime-v2-completion
          fi
          git rev-parse HEAD

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply repository compatibility patches
        run: bun run postinstall
      - name: Navigation Node unit tests (not Electron integration)
        run: bun run test:navigation:unit
