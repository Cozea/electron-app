name: Navigation runtime validation

on:
  push:
    branches: [fix/navigation-runtime-v2-completion]
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/navigation-runtime-validation.yml'

permissions:
  contents: read

concurrency:
  group: navigation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-edits:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/fix/navigation-runtime-v2-completion' && startsWith(github.event.head_commit.message, 'chore(navigation): apply source edit batch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.apply.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact source anchors on the isolated repair branch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          node scripts/navigation-repair/apply-source-edits.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps shared tests scripts docs
          git commit -m 'refactor(navigation): apply verified source integration edits'
          git push origin HEAD:fix/navigation-runtime-v2-completion
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  unit:
    needs: source-edits
    if: always() && (needs.source-edits.result == 'success' || needs.source-edits.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-edits.outputs.commit || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run postinstall
      - name: Navigation Node unit tests (not Electron integration)
        run: bun run test:navigation:unit

  source-checks:
    needs: source-edits
    if: always() && (needs.source-edits.result == 'success' || needs.source-edits.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        command: [typecheck, 'typecheck:electron', 'typecheck:tests', lint]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-edits.outputs.commit || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run postinstall
      - run: bun run ${{ matrix.command }}

  production-build:
    needs: source-edits
    if: always() && (needs.source-edits.result == 'success' || needs.source-edits.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_CONVEX_URL: https://navigation-validation.convex.cloud
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-edits.outputs.commit || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun run bootstrap
      - run: bun run build
      - name: Verify the standalone worker is emitted
        run: test -s apps/desktop/out/main/desktop-state-persistence.js
