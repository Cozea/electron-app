name: Collaboration v2 branch validation

on:
  push:
    branches:
      - refactor/collaboration-v2-end-to-end
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaboration-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck renderer
        run: bun run typecheck

      - name: Typecheck Electron
        run: bun run typecheck:electron

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Typecheck Cloudflare
        run: bun run typecheck:cloudflare

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Package source snapshot
        if: always()
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='**/node_modules' \
            --exclude=dist \
            --exclude=out \
            -czf cozea-collaboration-v2-source.tgz .

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cozea-collaboration-v2-source-${{ github.sha }}
          path: cozea-collaboration-v2-source.tgz
          retention-days: 3

      - name: Upload validation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-v2-validation-failure-${{ github.sha }}
          path: |
            npm-debug.log*
            bun-error.log*
            apps/desktop/*.log
          if-no-files-found: ignore
          retention-days: 7
