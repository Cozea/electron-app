name: Collaboration v2 branch validation

on:
  push:
    branches:
      - refactor/collaboration-v2-end-to-end
      - codex/collaboration-v2-complete
  workflow_dispatch:

env:
  VITE_GITHUB_COLLABORATION_RELEASE: "0"
  COLLABORATION_G3_CREATE_ENABLED: "0"

permissions:
  contents: read

concurrency:
  group: collaboration-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bootstrap repository
        run: bun run bootstrap

      - name: Verify pinned native runtime
        run: |
          bun run prepare:t3-runtime:check
          mkdir -p "$RUNNER_TEMP/collaboration-native"
          git -C vendor/t3code archive --format=tar.gz --output="$RUNNER_TEMP/collaboration-native/t3-source.tar.gz" HEAD
          cp vendor/t3code/apps/server/dist/bin.mjs "$RUNNER_TEMP/collaboration-native/bin.mjs"
          cp "$(command -v bun)" "$RUNNER_TEMP/collaboration-native/bun"
          tar -czf "$RUNNER_TEMP/collaboration-native/test-dependencies.tar.gz" \
            --exclude='*.woff*' --exclude='*.ttf' --exclude='*.otf' \
            --exclude='.env*' --exclude='*.pem' --exclude='*.key' \
            node_modules

      - name: Upload native boundary qualification fixture
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-native-${{ github.sha }}
          path: ${{ runner.temp }}/collaboration-native
          retention-days: 1

      - name: Install Electron runtime for tests
        run: node node_modules/electron/install.js

      - name: Typecheck renderer
        run: bun run typecheck

      - name: Typecheck Electron
        run: bun run typecheck:electron

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Typecheck Cloudflare
        run: bun run typecheck:cloudflare

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Upload validation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-v2-validation-failure-${{ github.sha }}
          path: |
            npm-debug.log*
            bun-error.log*
            apps/desktop/*.log
          if-no-files-found: ignore
          retention-days: 7
