name: Collaboration v2 branch validation

on:
  push:
    branches:
      - refactor/collaboration-v2-end-to-end
      - codex/collaboration-v2-complete
  workflow_dispatch:

env:
  VITE_GITHUB_COLLABORATION_RELEASE: "0"
  COLLABORATION_G3_CREATE_ENABLED: "0"

permissions:
  contents: read

concurrency:
  group: collaboration-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Bootstrap repository
        run: bun run bootstrap
      - name: Verify pinned native runtime
        run: bun run prepare:t3-runtime:check
      - name: Install Electron runtime for tests
        run: node node_modules/electron/install.js
      - name: Native shutdown regression tests
        run: >-
          bunx vitest run
          tests/collaboration/verifiedChildProcessStop.test.ts
          tests/collaboration/verifiedChildProcessStop.integration.test.ts
          tests/collaboration/t3BootstrapShutdown.test.ts
      - name: Typecheck renderer
        run: bun run typecheck
      - name: Typecheck Electron
        run: bun run typecheck:electron
      - name: Typecheck tests
        run: bun run typecheck:tests
      - name: Typecheck Cloudflare
        run: bun run typecheck:cloudflare
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Upload validation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-v2-validation-failure-${{ github.sha }}
          path: |
            npm-debug.log*
            bun-error.log*
            apps/desktop/*.log
          if-no-files-found: ignore
          retention-days: 7
