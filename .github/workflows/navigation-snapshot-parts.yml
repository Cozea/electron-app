name: Navigation Dependency Snapshot Parts
on:
  push:
    branches: [perf/navigation-runtime-v2-repair]
    paths: ['.github/workflows/navigation-snapshot-parts.yml']
permissions:
  contents: read
  actions: read
jobs:
  partition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34207307939
          name: navigation-repair-dependencies-34207307939
          path: snapshot
      - name: Partition dependency archives
        run: |
          set -euo pipefail
          mkdir parts
          split -b 400000000 snapshot/root-dependencies.tar.gz parts/root-
          split -b 400000000 snapshot/vendor-dependencies.tar.gz parts/vendor-
          sha256sum snapshot/*.tar.gz parts/*
      - uses: actions/upload-artifact@v4
        with:
          name: nav-root-aa
          path: parts/root-aa
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nav-root-ab
          path: parts/root-ab
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: nav-root-ac
          path: parts/root-ac
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: nav-vendor-aa
          path: parts/vendor-aa
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nav-vendor-ab
          path: parts/vendor-ab
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: nav-vendor-ac
          path: parts/vendor-ac
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
