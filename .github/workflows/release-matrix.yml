name: Desktop Release Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish artifacts to GitHub Releases'
        required: true
        default: 'never'
        type: choice
        options:
          - never
          - always

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            artifact_name: macos-arm64
            runs_on: macos-14
            electron_target: mac
            arch: arm64
            bundle_targets: darwin-arm64
          - name: macOS x64
            artifact_name: macos-x64
            runs_on: macos-13
            electron_target: mac
            arch: x64
            bundle_targets: darwin-x64
          - name: Windows x64
            artifact_name: windows-x64
            runs_on: windows-latest
            electron_target: win
            arch: x64
            bundle_targets: win32-x64
          - name: Windows arm64
            artifact_name: windows-arm64
            runs_on: windows-latest
            electron_target: win
            arch: arm64
            bundle_targets: win32-arm64
    env:
      CI: true
      COZEA_GIT_BUNDLE_TARGETS: ${{ matrix.bundle_targets }}
      COZEA_GIT_BUNDLE_URL_DARWIN_ARM64: ${{ secrets.COZEA_GIT_BUNDLE_URL_DARWIN_ARM64 }}
      COZEA_GIT_BUNDLE_URL_DARWIN_X64: ${{ secrets.COZEA_GIT_BUNDLE_URL_DARWIN_X64 }}
      COZEA_GIT_BUNDLE_URL_WIN32_X64: ${{ secrets.COZEA_GIT_BUNDLE_URL_WIN32_X64 }}
      COZEA_GIT_BUNDLE_URL_WIN32_ARM64: ${{ secrets.COZEA_GIT_BUNDLE_URL_WIN32_ARM64 }}
      PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish || 'always' }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate macOS release secrets
        if: matrix.electron_target == 'mac' && env.PUBLISH_MODE == 'always'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required macOS release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Bundled Git
        run: npm run prepare:bundled-git

      - name: Verify Bundled Git
        run: npm run prepare:bundled-git:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build and Package
        run: npm run dist -- --${{ matrix.electron_target }} --${{ matrix.arch }} --publish ${{ env.PUBLISH_MODE }}

      - name: Upload Dist Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-dist
          path: dist/**
          if-no-files-found: warn
