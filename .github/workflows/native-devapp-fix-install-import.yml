name: Fix native DevApp installation import

on:
  push:
    branches:
      - feat/native-devapp-platform
    paths:
      - ".github/workflows/native-devapp-fix-install-import.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-devapp-platform
          fetch-depth: 0

      - name: Add the missing IPC registration import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/electron/main.ts')
          source = path.read_text()
          marker = "import { registerDevAppAuthoringHandlers } from './ipc/registerDevAppAuthoringHandlers'\n"
          addition = marker + "import { registerDevAppInstallationHandlers } from './ipc/registerDevAppInstallationHandlers'\n"
          if "from './ipc/registerDevAppInstallationHandlers'" not in source:
              if marker not in source:
                  raise SystemExit('import insertion marker was not found')
              path.write_text(source.replace(marker, addition, 1))
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/electron/main.ts
          git commit -m "fix(devapps): register installation IPC handlers"
          git push origin HEAD:feat/native-devapp-platform
