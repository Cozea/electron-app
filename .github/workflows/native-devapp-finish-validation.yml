name: Native DevApp completion validation

on:
  push:
    branches:
      - feat/native-devapp-platform-finish

permissions:
  contents: read

concurrency:
  group: native-devapp-finish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize T3 substrate
        run: git submodule update --init vendor/t3code

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install T3 source dependencies
        run: bun x pnpm@11.10.0 --dir vendor/t3code install --frozen-lockfile --ignore-scripts

      - name: Prepare test scratch space
        run: mkdir -p .agent

      - name: Typecheck renderer
        run: bun run typecheck

      - name: Typecheck Electron
        run: bun run typecheck:electron

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Native DevApp tests
        run: bunx vitest run tests/devapps

      - name: Full test suite
        run: bun run test

      - name: Architecture tests
        run: bunx vitest run tests/architecture

      - name: Production build
        run: bun run build
