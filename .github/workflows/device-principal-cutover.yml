name: Device Principal Cutover

on:
  push:
    branches:
      - codex/device-principal-identity-cutover

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096
  VITE_CONVEX_URL: https://example.convex.cloud
  VITE_AI_API_URL: https://example.invalid

jobs:
  validate:
    name: Final verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Apply final source cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path

          layout = Path("apps/desktop/src/features/projects/layouts/ProjectLayout.tsx")
          source = layout.read_text()
          source = source.replace("  buildProjectRouteNavigationState,\n", "")
          layout.write_text(source)

          join_links = Path("convex/projectJoinLinks.ts")
          source = join_links.read_text()
          removals = [
              '''    // Transitional renderer argument. Authority is derived from ctx.auth.\n    userId: v.optional(v.id("devicePrincipals")),\n''',
              '''    // Transitional only; current principal is derived from device auth.\n    viewerUserId: v.optional(v.id("devicePrincipals")),\n''',
              '''    // Transitional renderer argument. Do not use it for authority.\n    actorUserId: v.optional(v.id("devicePrincipals")),\n''',
              '''    actorUserId: v.optional(v.id("devicePrincipals")),\n''',
              '''    actorUserId: v.optional(v.id("devicePrincipals")),\n''',
              '''    // Transitional caller metadata. The authenticated canonical device is the\n    // only identity used to create membership. These fields are removed once\n    // the renderer contract is cut over.\n    userId: v.optional(v.id("devicePrincipals")),\n    deviceId: v.optional(v.string()),\n    deviceLabel: v.optional(v.string()),\n    platform: v.optional(v.string()),\n    fingerprint: v.optional(v.string()),\n''',
          ]
          for removal in removals:
              if removal in source:
                  source = source.replace(removal, "", 1)
          join_links.write_text(source)
          PY

          if ! git diff --quiet; then
            git config user.name "cozea-verification"
            git config user.email "actions@users.noreply.github.com"
            git add apps/desktop/src/features/projects/layouts/ProjectLayout.tsx convex/projectJoinLinks.ts
            git commit -m "refactor(identity): remove transitional principal arguments"
            git push
          fi

      - name: Initialize pinned T3 source
        run: |
          git submodule sync -- vendor/t3code
          git submodule update --init --depth=1 -- vendor/t3code

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run postinstall
          node node_modules/electron/install.js

      - name: Prepare pinned T3 runtime
        run: bun run prepare:t3-runtime

      - name: Prepare test scratch directories
        run: mkdir -p .agent

      - name: Typecheck desktop
        run: bun run typecheck

      - name: Typecheck electron
        run: bun run typecheck:electron

      - name: Typecheck Cloudflare worker
        run: bun run typecheck:cloudflare

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Lint
        run: bun run lint

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Identity architecture tests
        run: bunx vitest run tests/identity

      - name: Full test suite
        run: bun run test

      - name: Production build
        run: bun run build
