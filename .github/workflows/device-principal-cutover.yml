name: Device Principal Cutover

on:
  push:
    branches:
      - codex/device-principal-identity-cutover

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compiler repair pass
        run: node scripts/fix-device-principal-pass1.mjs
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No repair changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(identity): repair cutover compiler contracts"
          git push origin HEAD:${GITHUB_REF_NAME}

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck desktop
        run: bun run typecheck
      - name: Typecheck cloudflare
        run: bun run typecheck:cloudflare
      - name: Typecheck tests
        run: bun run typecheck:tests
      - name: Identity tests
        run: bunx vitest run tests/identity
