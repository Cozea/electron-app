name: Device Principal Cutover

on:
  push:
    branches:
      - codex/device-principal-identity-cutover

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096
  VITE_CONVEX_URL: https://example.convex.cloud
  VITE_AI_API_URL: https://example.invalid

jobs:
  validate:
    name: Final verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Apply final branch repairs
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f"repair anchor missing in {path}: {old[:80]!r}")
              target.write_text(source.replace(old, new, 1))

          projects = Path("convex/projects.ts")
          projects_source = projects.read_text()
          enrollment_stage = '''    case 10: {
              const rows = await ctx.db
                .query("projectDeviceEnrollments")
                .withIndex("by_project_and_status", (q) => q.eq("projectId", projectId))
                .take(PROJECT_PURGE_BATCH_SIZE)
              await deleteRows(ctx, rows)
              return rows.length
            }
'''
          if enrollment_stage not in projects_source:
              anchor = '''    case 11: {
'''
              if anchor not in projects_source:
                  raise SystemExit("project purge stage anchor missing")
              projects.write_text(projects_source.replace(anchor, enrollment_stage + anchor, 1))

          replace_once(
              "tests/assistant/convexAuthGating.test.ts",
              'expect(presence).toContain("if (!isConvexAuthReady) return");',
              'expect(presence).toContain("if (!projectId || !userId || !isConvexAuthReady) return");',
          )

          gating = Path("tests/assistant/convexAuthGating.test.ts")
          gating_source = gating.read_text()
          old_share_test = '''  it("gates every authenticated query in the share button on principalId", () => {
              // getByEmails previously gated only on the email list, so invite-email
              // enrichment could crash the view during the auth gap.
              expect(shareButton).toContain(
                "principalId && inviteEmailCandidates.length > 0",
              );
            });'''
          new_share_test = '''  it("gates every authenticated query in the share button on principalId", () => {
              expect(shareButton).toContain(
                'projectId && principalId ? { projectId, userId: principalId } : "skip"',
              );
              expect(shareButton).toContain(
                'projectId && principalId ? { projectId, viewerUserId: principalId } : "skip"',
              );
              expect(shareButton).toContain(
                'projectId && principalId && memberRole === "project_manager" ? { projectId } : "skip"',
              );
            });'''
          if new_share_test not in gating_source:
              if old_share_test not in gating_source:
                  raise SystemExit("share-button gating test anchor missing")
              gating.write_text(gating_source.replace(old_share_test, new_share_test, 1))

          replace_once(
              "tests/architecture/desktopFirstLoadingPolicy.test.ts",
              'const [principalId, setConvexUserId] = useState<Id<"devicePrincipals"> | null>(null)',
              'const [principalId, setPrincipalId] = useState<Id<"devicePrincipals"> | null>(null)',
          )

          bootstrap_test = Path("tests/electron/desktopBootstrapStore.test.ts")
          bootstrap_source = bootstrap_test.read_text()
          if "desktop-bootstrap-session.v1.enc" in bootstrap_source:
              bootstrap_test.write_text(
                  bootstrap_source.replace(
                      "desktop-bootstrap-session.v1.enc",
                      "desktop-bootstrap-session.v2.enc",
                  )
              )
          PY

          if ! git diff --quiet; then
            git config user.name "cozea-verification"
            git config user.email "actions@users.noreply.github.com"
            git add convex/projects.ts \
              tests/assistant/convexAuthGating.test.ts \
              tests/architecture/desktopFirstLoadingPolicy.test.ts \
              tests/electron/desktopBootstrapStore.test.ts
            git commit -m "test(identity): align final cutover verification"
            git push
          fi

      - name: Initialize pinned T3 source
        run: |
          git submodule sync -- vendor/t3code
          git submodule update --init --depth=1 -- vendor/t3code

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run postinstall
          node node_modules/electron/install.js

      - name: Prepare pinned T3 runtime
        run: bun run prepare:t3-runtime

      - name: Prepare test scratch directories
        run: mkdir -p .agent

      - name: Typecheck desktop
        run: bun run typecheck

      - name: Typecheck electron
        run: bun run typecheck:electron

      - name: Typecheck Cloudflare worker
        run: bun run typecheck:cloudflare

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Lint
        run: bun run lint

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Identity architecture tests
        run: bunx vitest run tests/identity

      - name: Full test suite
        run: bun run test

      - name: Production build
        run: bun run build
