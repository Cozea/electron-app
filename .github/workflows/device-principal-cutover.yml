name: Device Principal Cutover

on:
  push:
    branches:
      - codex/device-principal-identity-cutover

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096
  VITE_CONVEX_URL: https://example.convex.cloud
  VITE_AI_API_URL: https://example.invalid

jobs:
  validate:
    name: Final verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Apply final source cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path

          tombstones = Path("convex/fileTombstones.ts")
          source = tombstones.read_text()
          source = source.replace(
              'function deviceDisplayName(device: { deviceLabel?: string; identityKey?: string }): string {\n  return device.deviceLabel?.trim() || device.identityKey?.trim() || "Unknown device"\n}',
              'function deviceDisplayName(device: { displayName?: string; identityKey?: string }): string {\n  return device.displayName?.trim() || device.identityKey?.trim() || "Unknown device"\n}',
          )
          source = source.replace(
              '    // Transitional caller field. Human/device attribution is derived from auth.\n    deletedBy: v.optional(v.id("devicePrincipals")),\n',
              '',
          )
          tombstones.write_text(source)

          locks = Path("convex/projectFileLocks.ts")
          source = locks.read_text()
          source = source.replace(
              'function displayName(device: {\n  deviceLabel?: string | undefined\n  identityKey?: string | undefined\n}): string {\n  return device.deviceLabel?.trim() || device.identityKey?.trim() || "Unknown device"\n}',
              'function displayName(device: {\n  displayName?: string | undefined\n  identityKey?: string | undefined\n}): string {\n  return device.displayName?.trim() || device.identityKey?.trim() || "Unknown device"\n}',
          )
          source = source.replace(
              '    // Transitional caller field. Lock ownership is derived from device auth.\n    userId: v.optional(v.id("devicePrincipals")),\n',
              '',
          )
          source = source.replace('    userId: v.optional(v.id("devicePrincipals")),\n', '', 1)
          source = source.replace('      lockedByUser: lockedByDevice\n', '      lockedByPrincipal: lockedByDevice\n')
          source = source.replace('            name: displayName(lockedByDevice),\n', '            displayName: displayName(lockedByDevice),\n')
          source = source.replace('            profileImageUrl: lockedByDevice.avatarStorageId ? await ctx.storage.getUrl(lockedByDevice.avatarStorageId) : null,\n', '            avatarUrl: lockedByDevice.avatarStorageId ? await ctx.storage.getUrl(lockedByDevice.avatarStorageId) : null,\n')
          locks.write_text(source)
          PY

          if ! git diff --quiet; then
            git config user.name "cozea-verification"
            git config user.email "actions@users.noreply.github.com"
            git add convex/fileTombstones.ts convex/projectFileLocks.ts
            git commit -m "refactor(identity): canonicalize lock and tombstone principals"
            git push
          fi

      - name: Initialize pinned T3 source
        run: |
          git submodule sync -- vendor/t3code
          git submodule update --init --depth=1 -- vendor/t3code

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run postinstall
          node node_modules/electron/install.js

      - name: Prepare pinned T3 runtime
        run: bun run prepare:t3-runtime

      - name: Prepare test scratch directories
        run: mkdir -p .agent

      - name: Typecheck desktop
        run: bun run typecheck

      - name: Typecheck electron
        run: bun run typecheck:electron

      - name: Typecheck Cloudflare worker
        run: bun run typecheck:cloudflare

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Lint
        run: bun run lint

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Identity architecture tests
        run: bunx vitest run tests/identity

      - name: Full test suite
        run: bun run test

      - name: Production build
        run: bun run build
