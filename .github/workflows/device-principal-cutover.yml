name: Device Principal Cutover

on:
  push:
    branches:
      - codex/device-principal-identity-cutover

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096
  VITE_CONVEX_URL: https://example.convex.cloud
  VITE_AI_API_URL: https://example.invalid

jobs:
  validate:
    name: Final verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Remove stale caller identity claims
        run: |
          python3 <<'PY'
          from pathlib import Path

          persistence = Path("apps/desktop/src/lib/yjs/ProjectFilesPersistence.ts")
          source = persistence.read_text()
          source = source.replace("              deletedBy: this.userId,\n", "")
          persistence.write_text(source)
          PY

          if ! git diff --quiet; then
            git config user.name "cozea-verification"
            git config user.email "actions@users.noreply.github.com"
            git add apps/desktop/src/lib/yjs/ProjectFilesPersistence.ts
            git commit -m "refactor(identity): remove tombstone caller identity claim"
            git push
          fi

      - name: Initialize pinned T3 source
        run: |
          git submodule sync -- vendor/t3code
          git submodule update --init --depth=1 -- vendor/t3code

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run postinstall
          node node_modules/electron/install.js

      - name: Prepare pinned T3 runtime
        run: bun run prepare:t3-runtime

      - name: Prepare test scratch directories
        run: mkdir -p .agent

      - name: Typecheck desktop
        run: bun run typecheck

      - name: Typecheck electron
        run: bun run typecheck:electron

      - name: Typecheck Cloudflare worker
        run: bun run typecheck:cloudflare

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Lint
        run: bun run lint

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Identity architecture tests
        run: bunx vitest run tests/identity

      - name: Full test suite
        run: bun run test

      - name: Production build
        run: bun run build
