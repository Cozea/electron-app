name: Device Principal Cutover

on:
  push:
    branches:
      - codex/device-principal-identity-cutover

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck desktop
        run: bun run typecheck
      - name: Typecheck cloudflare
        run: bun run typecheck:cloudflare
      - name: Typecheck tests
        run: bun run typecheck:tests
      - name: Identity tests
        run: bunx vitest run tests/identity
