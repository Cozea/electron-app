name: Device Principal Cutover

on:
  push:
    branches:
      - codex/device-principal-identity-cutover

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096
  VITE_CONVEX_URL: https://example.convex.cloud
  VITE_AI_API_URL: https://example.invalid

jobs:
  validate:
    name: Final verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Apply final branch repairs
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f"repair anchor missing in {path}: {old[:100]!r}")
              target.write_text(source.replace(old, new, 1))

          # Final verification repairs from the first complete-suite run.
          projects = Path("convex/projects.ts")
          projects_source = projects.read_text()
          enrollment_stage = "\n".join([
              "    case 10: {",
              "      const rows = await ctx.db",
              "        .query(\"projectDeviceEnrollments\")",
              "        .withIndex(\"by_project_and_status\", (q) => q.eq(\"projectId\", projectId))",
              "        .take(PROJECT_PURGE_BATCH_SIZE)",
              "      await deleteRows(ctx, rows)",
              "      return rows.length",
              "    }",
              "",
          ])
          if enrollment_stage not in projects_source:
              anchor = "    case 11: {\n"
              if anchor not in projects_source:
                  raise SystemExit("project purge stage anchor missing")
              projects_source = projects_source.replace(anchor, enrollment_stage + anchor, 1)

          # Delete the ancient email/profile-based project-team compatibility payload.
          team_arg = "\n".join([
              "    team: v.optional(",
              "      v.array(",
              "        v.object({",
              "          email: v.string(),",
              "          name: v.optional(v.string()),",
              "          role: v.union(",
              "            v.literal(\"project_manager\"),",
              "            v.literal(\"developer\"),",
              "            v.literal(\"designer\"),",
              "            v.literal(\"viewer\"),",
              "          ),",
              "          isCurrentUser: v.optional(v.boolean()),",
              "          profileImageUrl: v.optional(v.union(v.string(), v.null())),",
              "        }),",
              "      ),",
              "    ),",
              "",
          ])
          if team_arg in projects_source:
              projects_source = projects_source.replace(team_arg, "", 1)

          apply_start = projects_source.find("\nexport const applyInitialTeamSetup = mutation({")
          if apply_start != -1:
              apply_end_marker = "\nexport const listForCurrentUser = query({"
              apply_end = projects_source.find(apply_end_marker, apply_start)
              if apply_end == -1:
                  raise SystemExit("applyInitialTeamSetup end anchor missing")
              projects_source = projects_source[:apply_start] + projects_source[apply_end:]
          projects.write_text(projects_source)

          replace_once(
              "tests/assistant/convexAuthGating.test.ts",
              'expect(presence).toContain("if (!isConvexAuthReady) return");',
              'expect(presence).toContain("if (!projectId || !userId || !isConvexAuthReady) return");',
          )
          replace_once(
              "tests/assistant/convexAuthGating.test.ts",
              '"principalId && inviteEmailCandidates.length > 0"',
              '\'projectId && principalId ? { projectId, userId: principalId } : "skip"\'',
          )
          replace_once(
              "tests/assistant/convexAuthGating.test.ts",
              "// getByEmails previously gated only on the email list, so invite-email",
              "// All share-surface reads require a live authenticated device principal;",
          )
          replace_once(
              "tests/assistant/convexAuthGating.test.ts",
              "// enrichment could crash the view during the auth gap.",
              "// cached shell presentation alone must never open cloud queries.",
          )
          replace_once(
              "tests/architecture/desktopFirstLoadingPolicy.test.ts",
              'const [principalId, setConvexUserId] = useState<Id<"devicePrincipals"> | null>(null)',
              'const [principalId, setPrincipalId] = useState<Id<"devicePrincipals"> | null>(null)',
          )

          bootstrap_test = Path("tests/electron/desktopBootstrapStore.test.ts")
          bootstrap_source = bootstrap_test.read_text()
          if "desktop-bootstrap-session.v1.enc" in bootstrap_source:
              bootstrap_test.write_text(bootstrap_source.replace(
                  "desktop-bootstrap-session.v1.enc",
                  "desktop-bootstrap-session.v2.enc",
              ))

          # Delete the matching dead renderer path. No producer remains and the mutation was a no-op.
          layout = Path("apps/desktop/src/features/projects/layouts/ProjectLayout.tsx")
          layout_source = layout.read_text()
          layout_source = layout_source.replace(
              'import { lazy, Suspense, type ReactNode, useRef, useCallback, useEffect, useMemo,  } from "react";',
              'import { lazy, Suspense, type ReactNode, useCallback, useEffect, useMemo } from "react";',
          )
          layout_source = layout_source.replace(
              'import { useMutation, useQuery } from "convex/react";',
              'import { useQuery } from "convex/react";',
          )
          pending_field = "\n".join([
              "  pendingTeamSetup?: Array<{",
              "    email: string;",
              "    name?: string;",
              '    role: "project_manager" | "developer" | "designer" | "viewer";',
              "    isCurrentUser?: boolean;",
              "    profileImageUrl?: string | null;",
              "  }>;",
              "",
          ])
          if pending_field in layout_source:
              layout_source = layout_source.replace(pending_field, "", 1)

          effect_start = layout_source.find("/**\n * Null-rendering sibling that owns the deferred team-setup flow.")
          if effect_start != -1:
              effect_end = layout_source.find("/**\n * Presence subscription isolated from the layout", effect_start)
              if effect_end == -1:
                  raise SystemExit("PendingTeamSetupEffect end anchor missing")
              layout_source = layout_source[:effect_start] + layout_source[effect_end:]

          pending_jsx = "\n".join([
              "      {project?._id && principalId ? (",
              "        <PendingTeamSetupEffect",
              "          projectId={project._id}",
              "          principalId={principalId}",
              "          projectSlug={projectSlug}",
              "          projectName={effectiveProjectName}",
              "          runtimeWorkspaceId={runtimeWorkspaceId}",
              "          routeProjectId={routeProjectId ?? null}",
              "        />",
              "      ) : null}",
              "",
          ])
          if pending_jsx in layout_source:
              layout_source = layout_source.replace(pending_jsx, "", 1)
          layout.write_text(layout_source)

          # Rename the device-session recovery API away from human login/logout semantics.
          auth = Path("apps/desktop/src/contexts/AuthContext.tsx")
          auth_source = auth.read_text()
          auth_source = auth_source.replace(
              "import { clearDeviceSession, getDeviceSession, type DeviceSession } from '@/lib/deviceSession'",
              "import { getDeviceSession, type DeviceSession } from '@/lib/deviceSession'",
          )
          auth_source = auth_source.replace(
              "  login: () => Promise<void>\n  logout: () => Promise<void>\n",
              "  retryDeviceSession: () => Promise<void>\n",
          )
          auth_source = auth_source.replace("  const login = useCallback(async () => {", "  const retryDeviceSession = useCallback(async () => {")
          auth_source, removed_logout = re.subn(
              r"\n  const logout = useCallback\(async \(\) => \{.*?\n  \}, \[\]\)\n",
              "\n",
              auth_source,
              count=1,
              flags=re.S,
          )
          auth_source = auth_source.replace("      login,\n      logout,\n", "      retryDeviceSession,\n")
          auth_source = auth_source.replace("      login,\n      logout,\n", "      retryDeviceSession,\n")
          auth_source = auth_source.replace("      login,\n", "      retryDeviceSession,\n")
          auth_source = auth_source.replace("      logout,\n", "")
          auth.write_text(auth_source)

          page = Path("apps/desktop/src/pages/Login.tsx")
          if page.exists():
              page_source = page.read_text()
              page_source = page_source.replace('import { LoginForm } from "@/components/login-form"', 'import { DeviceSessionRecoveryForm } from "@/components/device-session-recovery"')
              page_source = page_source.replace("export function Login() {", "export function DeviceSessionRecovery() {")
              page_source = page_source.replace("const { login, isLoading, authError } = useAuth()", "const { retryDeviceSession, isLoading, authError } = useAuth()")
              page_source = page_source.replace("<LoginForm onLogin={login}", "<DeviceSessionRecoveryForm onRetry={retryDeviceSession}")
              page.write_text(page_source)

          form = Path("apps/desktop/src/components/login-form.tsx")
          if form.exists():
              form_source = form.read_text()
              form_source = form_source.replace("interface LoginFormProps", "interface DeviceSessionRecoveryFormProps")
              form_source = form_source.replace("  onLogin: () => void", "  onRetry: () => void")
              form_source = form_source.replace("export function LoginForm({", "export function DeviceSessionRecoveryForm({")
              form_source = form_source.replace("  onLogin,", "  onRetry,")
              form_source = form_source.replace("}: LoginFormProps)", "}: DeviceSessionRecoveryFormProps)")
              form_source = form_source.replace("onClick={onLogin}", "onClick={onRetry}")
              form_source = form_source.replace('t("login.', 't("deviceSession.')
              form.write_text(form_source)

          app = Path("apps/desktop/src/App.tsx")
          app_source = app.read_text()
          app_source = app_source.replace("const LazyLogin = lazy(() =>", "const LazyDeviceSessionRecovery = lazy(() =>")
          app_source = app_source.replace("import('./pages/Login').then((module) => ({", "import('./pages/DeviceSessionRecovery').then((module) => ({")
          app_source = app_source.replace("default: module.Login,", "default: module.DeviceSessionRecovery,")
          app_source = app_source.replace("<LazyLogin />", "<LazyDeviceSessionRecovery />")
          app_source = app_source.replace("It starts after sign-in because a run", "It starts after the device session is ready because a run")
          app.write_text(app_source)

          for locale_path, old_comment, new_comment in [
              ("apps/desktop/src/lib/i18n/en.ts", "// ── Login / Auth", "// ── Device session"),
              ("apps/desktop/src/lib/i18n/es.ts", "// ── Inicio de sesión / Autenticación", "// ── Sesión del dispositivo"),
          ]:
              locale = Path(locale_path)
              locale_source = locale.read_text().replace('"login.', '"deviceSession.')
              locale_source = locale_source.replace(old_comment, new_comment)
              locale.write_text(locale_source)

          session_path = Path("apps/desktop/src/lib/deviceSession.ts")
          session_source = session_path.read_text()
          session_source = session_source.replace("login failure merely because local secure storage is unavailable.", "device-session failure merely because local secure storage is unavailable.")
          session_source = session_source.replace("Persisted secure state is part of logout/reset semantics. If its deletion", "Persisted secure state is part of session-clear/reset semantics. If its deletion")
          session_source = session_source.replace("completed logout that would silently restore on next launch.", "completed clear that would silently restore on next launch.")
          session_path.write_text(session_source)

          import_hook = Path("apps/desktop/src/features/projects/hooks/useLocalProjectImport.ts")
          import_source = import_hook.read_text().replace(
              'await showImportError("No project profile is ready right now.")',
              'await showImportError("No device identity is ready right now.")',
          )
          import_hook.write_text(import_source)

          perf_readme = Path("scripts/perf/README.md")
          perf_source = perf_readme.read_text()
          perf_source = perf_source.replace(
              "- ProjectLayout must not subscribe to `location.href`, navigation state it\n  doesn't render, presence, or page-context objects — those live in\n  null-rendering/leaf siblings (`PendingTeamSetupEffect`,\n  `ProjectPresenceHeaderAddon`).",
              "- High-frequency presence and page-context subscriptions stay out of\n  ProjectLayout and live in the leaf `ProjectPresenceHeaderAddon` component.",
          )
          perf_readme.write_text(perf_source)
          PY

          if [ -f apps/desktop/src/pages/Login.tsx ]; then
            git mv apps/desktop/src/pages/Login.tsx apps/desktop/src/pages/DeviceSessionRecovery.tsx
          fi
          if [ -f apps/desktop/src/components/login-form.tsx ]; then
            git mv apps/desktop/src/components/login-form.tsx apps/desktop/src/components/device-session-recovery.tsx
          fi

          if ! git diff --quiet; then
            git config user.name "cozea-verification"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "refactor(identity): remove final account-era compatibility paths"
            git push
          fi

      - name: Initialize pinned T3 source
        run: |
          git submodule sync -- vendor/t3code
          git submodule update --init --depth=1 -- vendor/t3code

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run postinstall
          node node_modules/electron/install.js

      - name: Prepare pinned T3 runtime
        run: bun run prepare:t3-runtime

      - name: Prepare test scratch directories
        run: mkdir -p .agent

      - name: Typecheck desktop
        run: bun run typecheck

      - name: Typecheck electron
        run: bun run typecheck:electron

      - name: Typecheck Cloudflare worker
        run: bun run typecheck:cloudflare

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Lint
        run: bun run lint

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Identity architecture tests
        run: bunx vitest run tests/identity

      - name: Full test suite
        run: bun run test

      - name: Production build
        run: bun run build
