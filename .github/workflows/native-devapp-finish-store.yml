name: Finish Native DevApp Store lifecycle

on:
  push:
    branches:
      - feat/native-devapp-platform-finish

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize T3 substrate
        run: git submodule update --init vendor/t3code

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install T3 source dependencies
        run: bun x pnpm@11.10.0 --dir vendor/t3code install --frozen-lockfile --ignore-scripts

      - name: Prepare test scratch space
        run: mkdir -p .agent

      - name: Apply Store and Settings integration
        run: python .automation/native-devapp-finish-store.py

      - name: Format changed sources
        run: |
          bunx --bun oxfmt --write \
            apps/desktop/src/features/devapps/pages/AppStorePage.tsx \
            apps/desktop/src/features/settings/DevAppSettings.tsx \
            apps/desktop/src/features/workbench/WorkbenchDevAppPreviewTile.tsx \
            tests/devapps/appStoreSections.test.ts

      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(devapps): integrate installed apps with Store and Settings'
          git push origin HEAD:feat/native-devapp-platform-finish

      - name: Typecheck renderer
        run: bun run typecheck

      - name: Typecheck Electron
        run: bun run typecheck:electron

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: DevApp model and launch tests
        run: >-
          bunx vitest run
          tests/devapps/appStoreSections.test.ts
          tests/devapps/installedDevAppManifest.test.ts
          tests/devapps/devAppLaunchResolver.test.ts
          tests/devapps/workbenchTileRegistry.test.ts

      - name: Native DevApp tests
        run: bunx vitest run tests/devapps

      - name: Full test suite
        run: bun run test

      - name: Production build
        run: bun run build
