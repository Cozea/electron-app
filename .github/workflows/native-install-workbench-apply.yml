name: Apply native DevApp installation slice

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/native-install-workbench.patch.gz"
      - ".github/workflows/native-install-workbench-apply.yml"

permissions:
  contents: write

concurrency:
  group: native-install-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply synchronized installation and workbench patch
        shell: bash
        run: |
          set -euo pipefail
          gzip --decompress --stdout .github/native-install-workbench.patch.gz > /tmp/native-install-workbench.patch
          git apply --check /tmp/native-install-workbench.patch
          git apply --index /tmp/native-install-workbench.patch
          git rm .github/native-install-workbench.patch.gz
          git rm .github/workflows/native-install-workbench-apply.yml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(devapps): install native releases into generic workbench tiles"
          git push origin "HEAD:${{ github.head_ref }}"
