name: Apply native DevApp implementation patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/native-devapp-slice1.chunk.*"
      - ".github/workflows/native-devapp-apply-patch.yml"

permissions:
  contents: write

concurrency:
  group: native-devapp-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and apply the implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/native-devapp-slice1.chunk.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/native-devapp.patch
          git apply --check /tmp/native-devapp.patch
          git apply --index /tmp/native-devapp.patch
          # The GitHub Actions token may update source code but cannot create a new
          # workflow file. The validator is installed separately through the GitHub API.
          git restore --staged .github/workflows/native-devapp-validation.yml
          rm .github/workflows/native-devapp-validation.yml
          git rm .github/native-devapp-slice1.chunk.*
          git rm .github/workflows/native-devapp-apply-patch.yml

      - name: Commit the implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(devapps): run native React packages in workbench previews"
          git push origin "HEAD:${{ github.head_ref }}"
