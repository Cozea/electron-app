name: Navigation Repair Snapshot
on:
  push:
    branches: [perf/navigation-runtime-v2-repair]
    paths: ['.github/workflows/navigation-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Archive exact repository and pinned vendor source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nav-source" "$RUNNER_TEMP/nav-deps"
          git bundle create "$RUNNER_TEMP/nav-source/repository.bundle" HEAD refs/remotes/origin/main refs/remotes/origin/perf/navigation-runtime-v2-repair
          pin="$(git ls-tree HEAD vendor/t3code | awk '{print $3}')"
          test -n "$pin"
          git init "$RUNNER_TEMP/nav-t3-source"
          git -C "$RUNNER_TEMP/nav-t3-source" fetch --depth=1 https://github.com/Cozea/t3code.git "$pin"
          test "$(git -C "$RUNNER_TEMP/nav-t3-source" rev-parse FETCH_HEAD)" = "$pin"
          mkdir -p vendor/t3code
          git -C "$RUNNER_TEMP/nav-t3-source" archive FETCH_HEAD | tar -x -C vendor/t3code
          tar -czf "$RUNNER_TEMP/nav-source/vendor-source.tar.gz" vendor/t3code
          git rev-parse HEAD > "$RUNNER_TEMP/nav-source/HEAD.txt"
          cp "$(command -v bun)" "$RUNNER_TEMP/nav-source/bun"
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-repair-source-${{ github.run_id }}
          path: ${{ runner.temp }}/nav-source/
          retention-days: 1
          if-no-files-found: error
      - name: Install and archive locked dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run postinstall
          pm="$(node -p 'require("./vendor/t3code/package.json").packageManager.split("+")[0]')"
          bun x "$pm" --dir vendor/t3code install --frozen-lockfile --ignore-scripts
          bun node_modules/electron/install.js
          printf '%s\0' node_modules > "$RUNNER_TEMP/root-dep-paths"
          find apps packages -type d -name node_modules -prune -print0 >> "$RUNNER_TEMP/root-dep-paths"
          tar --null -T "$RUNNER_TEMP/root-dep-paths" -czf "$RUNNER_TEMP/nav-deps/root-dependencies.tar.gz"
          find vendor/t3code -type d -name node_modules -prune -print0 > "$RUNNER_TEMP/vendor-dep-paths"
          tar --null -T "$RUNNER_TEMP/vendor-dep-paths" -czf "$RUNNER_TEMP/nav-deps/vendor-dependencies.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-repair-dependencies-${{ github.run_id }}
          path: ${{ runner.temp }}/nav-deps/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
