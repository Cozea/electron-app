name: PR141 main-port stabilization

on:
  push:
    branches:
      - integration/pr141-main-port
    paths:
      - .github/workflows/pr141-main-port.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr141-main-port-stabilize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Synchronize current main
        run: |
          git fetch origin main
          git config user.name 'Cozea collaboration port'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main

      - name: Stabilize generation-3 activation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The renderer may only receive the intentionally reduced collaboration
          # surface. Remove the stale full DesktopAPI bridge that the earlier port
          # accidentally left beside CollaborationRendererAPI.
          types_path = Path('shared/electronApiTypes.ts')
          text = types_path.read_text()
          text = text.replace("import type { CollaborationDesktopAPI } from './collaborationDesktop'\n", '')
          text = text.replace('  collaboration: CollaborationDesktopAPI\n', '')
          types_path.write_text(text)

          preload_path = Path('apps/desktop/electron/preload.ts')
          preload = preload_path.read_text()
          preload = preload.replace("import type { CollaborationDesktopAPI } from '../../../shared/collaborationDesktop'\n", '')
          duplicate = preload.find('const collaborationBridge: CollaborationDesktopAPI =')
          if duplicate != -1:
              expose = preload.find("contextBridge.exposeInMainWorld('electronAPI', {", duplicate)
              if expose == -1:
                  raise SystemExit('Could not locate electronAPI exposure after stale collaboration bridge')
              preload = preload[:duplicate] + preload[expose:]
          preload_path.write_text(preload)

          # Durable collaboration shutdown belongs to will-quit, after renderer
          # unload guards have succeeded. before-quit is cancelable and must not
          # dispose the workspace catalog or swallow recovery failures.
          main_path = Path('apps/desktop/electron/main.ts')
          main = main_path.read_text()
          start = main.find('let collaborationShutdownReady = false')
          end = main.find("app.on('will-quit'", start)
          if start != -1 and end != -1:
              replacement = """app.on('before-quit', () => {\n  appIsQuitting = true\n  logAssistantBridge('app-before-quit')\n  stopUpdateChecks()\n})\n\n"""
              main = main[:start] + replacement + main[end:]
          main_path.write_text(main)
          PY

      - name: Verify activation invariants
        run: |
          git diff --check
          grep -q "registerCollaborationHandlers(ipcMain, app.getPath('userData'))" apps/desktop/electron/main.ts
          grep -q "collaboration: collaborationBridge" apps/desktop/electron/preload.ts
          grep -q "const collaborationBridge: CollaborationRendererAPI" apps/desktop/electron/preload.ts
          if grep -q "CollaborationDesktopAPI" apps/desktop/electron/preload.ts; then
            echo 'Full main-process collaboration API leaked into preload typing.' >&2
            exit 1
          fi
          if grep -q "collaborationShutdownReady" apps/desktop/electron/main.ts; then
            echo 'Cancelable before-quit still owns durable collaboration shutdown.' >&2
            exit 1
          fi
          if grep -q "activeBranch === collabBranch" apps/desktop/src/features/projects/layouts/ProjectLayout.tsx; then
            echo 'Legacy branch-implies-live collaboration is still active.' >&2
            exit 1
          fi
          grep -q "const sharedCollaborationEnabled = false" apps/desktop/src/contexts/project/ProjectSyncProviderRuntime.tsx
          git status --short

      - name: Commit stabilization
        run: |
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'fix(collaboration): stabilize generation-3 ownership cutover'
          fi
          git push origin HEAD:integration/pr141-main-port
