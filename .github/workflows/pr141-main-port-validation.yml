name: PR141 main-port validation

on:
  push:
    branches:
      - integration/pr141-main-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr141-main-port-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Bootstrap repository
        run: bun run bootstrap
      - name: Install Electron runtime for tests
        run: node node_modules/electron/install.js
      - name: Prepare deterministic test fixture
        run: mkdir -p .agent
      - name: Run validation matrix
        shell: bash
        run: |
          set +e
          mkdir -p .validation
          failures=0
          run_check() {
            name="$1"; shift
            echo "== $name =="
            "$@" 2>&1 | tee ".validation/${name}.log"
            code=${PIPESTATUS[0]}
            echo "$code" > ".validation/${name}.status"
            if [ "$code" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          run_check renderer-typecheck bun run typecheck
          run_check electron-typecheck bun run typecheck:electron
          run_check test-typecheck bun run typecheck:tests
          run_check cloudflare-typecheck bun run typecheck:cloudflare
          run_check lint bun run lint
          run_check tests bun run test
          run_check build bun run build
          echo "$failures" > .validation/failures
          exit "$([ "$failures" -eq 0 ] && echo 0 || echo 1)"
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr141-main-port-validation-${{ github.sha }}
          path: .validation
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

