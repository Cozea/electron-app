name: Final collaboration settings cutover

on:
  push:
    branches:
      - integration/pr141-main-port
    paths:
      - .github/workflows/final-collaboration-settings-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disable legacy room bootstrap and extend architecture gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings_path = Path('apps/desktop/src/features/settings/pages/ProjectSettingsPage.tsx')
          settings = settings_path.read_text()
          legacy = "    enabled: Boolean(project?._id),"
          replacement = "    enabled: false, // gen-3 owns session keys/recovery; settings must not bootstrap the legacy room"
          if legacy in settings:
              settings = settings.replace(legacy, replacement, 1)
          elif replacement not in settings:
              raise SystemExit('legacy Project Settings collaboration bootstrap anchor missing')
          settings_path.write_text(settings)

          test_path = Path('tests/architecture/collaborationGeneration3Cutover.test.ts')
          test = test_path.read_text()
          marker = '  it("registers the full generation-3 gateway", () => {'
          block = '''  it("does not bootstrap the legacy room from Project Settings", () => {\n    const settings = read("apps/desktop/src/features/settings/pages/ProjectSettingsPage.tsx")\n    expect(settings).toContain("enabled: false, // gen-3 owns session keys/recovery")\n    expect(settings).not.toContain("enabled: Boolean(project?._id)")\n  })\n\n'''
          if block not in test:
              if marker not in test:
                  raise SystemExit('generation-3 architecture test insertion anchor missing')
              test = test.replace(marker, block + marker, 1)
          test_path.write_text(test)
          PY
      - name: Remove one-time cutover workflow
        run: git rm .github/workflows/final-collaboration-settings-cutover.yml
      - name: Commit final settings cutover
        run: |
          git config user.name 'Cozea collaboration cutover'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/features/settings/pages/ProjectSettingsPage.tsx tests/architecture/collaborationGeneration3Cutover.test.ts
          git diff --cached --check
          git commit -m 'refactor(collaboration): retire legacy settings room bootstrap'
          git push origin HEAD:integration/pr141-main-port
