name: Integrate Erick project-memory branch v2

on:
  push:
    branches:
      - integration/erick-project-memory-on-refactor

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Merge into canonical feature paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/project-memory main refactor/repository-architecture
          git config user.name "Cozea Integration Bot"
          git config user.email "actions@users.noreply.github.com"

          merge_base="$(git merge-base HEAD origin/feat/project-memory)"
          git merge --no-commit --no-ff origin/feat/project-memory || true

          merge_into_canonical() {
            local source_path="$1"
            local destination_path="$2"
            local stem
            stem="$(basename "$source_path")"
            git show "${merge_base}:${source_path}" > "/tmp/${stem}.base"
            git show "origin/feat/project-memory:${source_path}" > "/tmp/${stem}.theirs"
            git show "HEAD:${destination_path}" > "/tmp/${stem}.ours"
            git merge-file -p "/tmp/${stem}.ours" "/tmp/${stem}.base" "/tmp/${stem}.theirs" > "$destination_path" || true
            git checkout HEAD -- "$source_path"
          }

          merge_into_canonical \
            apps/desktop/src/features/projects/components/sidebar/SidebarLaneTiles.tsx \
            apps/desktop/src/features/projects/ui/sidebar/SidebarLaneTiles.tsx
          merge_into_canonical \
            apps/desktop/src/features/projects/lib/workbenchSelectionLaunch.ts \
            apps/desktop/src/features/workbench/model/workbenchSelectionLaunch.ts
          merge_into_canonical \
            apps/desktop/src/features/projects/lib/workbenchTileRegistry.ts \
            apps/desktop/src/features/workbench/model/workbenchTileRegistry.ts
          merge_into_canonical \
            apps/desktop/src/hooks/useDevServerManager.ts \
            apps/desktop/src/features/dev-server/hooks/useDevServerManager.ts
          merge_into_canonical \
            apps/desktop/src/stores/useProjectWorkbenchStore.ts \
            apps/desktop/src/features/workbench/model/workbenchStore.ts

          for path in \
            apps/desktop/src/features/dev-server/devServerProcessConfigStore.ts \
            apps/desktop/src/features/workbench/DevServerProcessesDialog.tsx \
            apps/desktop/src/features/workbench/WorkbenchMemoryTile.tsx \
            apps/desktop/src/features/workbench/WorkbenchMemoryTileHeaderActions.tsx \
            apps/desktop/src/features/workbench/WorkbenchMemoryTileInfo.tsx
          do
            git checkout --theirs -- "$path"
          done

          if [[ -d apps/desktop/src/features/projects/memory ]]; then
            git mv apps/desktop/src/features/projects/memory apps/desktop/src/features/project-memory
          fi

          python3 <<'PY'
          from __future__ import annotations

          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD"], text=True
          ).splitlines()

          replacements = {
              "@/features/projects/memory/": "@/features/project-memory/",
              "@/features/projects/devserver/": "@/features/dev-server/",
              "@/features/projects/components/workbench/": "@/features/workbench/",
              "@/features/projects/lib/workbenchSelectionLaunch": "@/features/workbench/model/workbenchSelectionLaunch",
              "@/features/projects/lib/workbenchTileRegistry": "@/features/workbench/model/workbenchTileRegistry",
              "@/features/projects/components/sidebar/SidebarLaneTiles": "@/features/projects/ui/sidebar/SidebarLaneTiles",
              "@/features/projects/components/sidebar/projectSidebarShared": "@/features/projects/ui/sidebar/projectSidebarShared",
              "@/features/projects/components/NativeProjectFolderIcon": "@/features/projects/ui/NativeProjectFolderIcon",
              "@/hooks/useDevServerManager": "@/features/dev-server/hooks/useDevServerManager",
              "@/stores/useProjectWorkbenchStore": "@/features/workbench/model/workbenchStore",
              "apps/desktop/src/features/projects/memory/": "apps/desktop/src/features/project-memory/",
              "apps/desktop/src/features/projects/devserver/": "apps/desktop/src/features/dev-server/",
              "apps/desktop/src/features/projects/components/workbench/": "apps/desktop/src/features/workbench/",
              "apps/desktop/src/hooks/useDevServerManager.ts": "apps/desktop/src/features/dev-server/hooks/useDevServerManager.ts",
              "apps/desktop/src/stores/useProjectWorkbenchStore.ts": "apps/desktop/src/features/workbench/model/workbenchStore.ts",
              "apps/desktop/src/features/projects/lib/workbenchSelectionLaunch.ts": "apps/desktop/src/features/workbench/model/workbenchSelectionLaunch.ts",
              "apps/desktop/src/features/projects/lib/workbenchTileRegistry.ts": "apps/desktop/src/features/workbench/model/workbenchTileRegistry.ts",
          }

          convex_import = re.compile(
              r"(?P<quote>['\"])(?P<path>(?:\.\./)+convex/_generated/(?P<suffix>[^'\"]+))(?P=quote)"
          )
          source_suffixes = {".ts", ".tsx", ".mts", ".mjs"}

          for relative in changed:
              path = root / relative
              if not path.is_file() or path.suffix not in source_suffixes | {".md"}:
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)

              if path.suffix in source_suffixes:
                  def resolve_convex(match: re.Match[str]) -> str:
                      target = root / "convex" / "_generated" / match.group("suffix")
                      relative_target = os.path.relpath(target, path.parent).replace(os.sep, "/")
                      if not relative_target.startswith("."):
                          relative_target = f"./{relative_target}"
                      quote = match.group("quote")
                      return f"{quote}{relative_target}{quote}"

                  text = convex_import.sub(resolve_convex, text)
                  text = "\n".join(line.rstrip() for line in text.splitlines()).rstrip() + "\n"

              path.write_text(text, encoding="utf-8")
          PY

          mkdir -p apps/desktop/src/features/project-memory
          cat > apps/desktop/src/features/project-memory/README.md <<'EOF'
          # Project Memory feature

          Owns renderer-side project-memory graph state, layout, relevance rules, update events, and controls. The Electron `ProjectMemoryService` reads agent-generated `graphify-out/graph.json`; agents receive the managed Project Memory skill and provider-specific instructions.

          Workbench files host the visual tile, while graph interpretation and update state remain feature-owned here.
          EOF

          python3 <<'PY'
          from pathlib import Path
          path = Path("docs/current/repository-map.md")
          text = path.read_text()
          needle = "    projects/           identity, lifecycle, access, navigation, dialog and header state\n"
          addition = needle + "    project-memory/     agent-generated code graph state, layout and controls\n"
          if "project-memory/" not in text and needle in text:
              text = text.replace(needle, addition)
          path.write_text(text)
          PY

          cat > docs/current/erick-branch-integration-2026-09-04.md <<'EOF'
          # Erick branch integration — 2026-09-04

          Status: integrated for review

          Erick Xu's historical pull requests were already merged. Two live branches retained unique work:

          - `fix/dev-server-additional-processes`
          - `feat/project-memory`

          `feat/project-memory` is a strict superset of the dev-server branch, so it was integrated once. The port preserves the repository architecture by placing memory state under `features/project-memory`, dev-server state under `features/dev-server`, and tile presentation under `features/workbench`.

          The integration includes descendant/auxiliary dev-server process tracking, the built-in Project Memory skill and DevApp, managed provider instruction blocks, graph reading and change classification, workbench memory presentation, deletion cleanup, and focused tests.
          EOF

          git rm .github/workflows/diagnose-erick-project-memory.yml
          git rm .github/workflows/integrate-erick-project-memory-v2.yml
          git add -A

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unresolved" ]]; then
            echo "Unresolved merge paths:"
            echo "$unresolved"
            exit 1
          fi

          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!vendor/**' ':!bun.lock'; then
            echo "Conflict markers remain"
            exit 1
          fi

          git diff --cached --check
          git status --short
          git commit -m "merge(erick): integrate project memory and dev-server process trees"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Initialize substrate
        shell: bash
        run: git submodule update --init vendor/t3code

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Validate integrated architecture
        shell: bash
        run: |
          bun run check:boundaries
          bun run typecheck
          bun run typecheck:electron
          bun run typecheck:tests
          bun run lint

      - name: Run focused integration tests
        shell: bash
        run: |
          bunx vitest run \
            tests/agent-skills \
            tests/project-memory \
            tests/dev-server \
            tests/devapps/workbenchTileRegistry.test.ts \
            tests/src/stores/workbenchPersistedMigration.test.ts

      - name: Build renderer and Electron bundles
        shell: bash
        run: bun run build

      - name: Push validated merge
        shell: bash
        run: git push origin HEAD:integration/erick-project-memory-on-refactor
