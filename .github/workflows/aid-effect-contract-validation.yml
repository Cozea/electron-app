name: AID Final Contract Audit

on:
  push:
    branches: [feat/programmable-aids-runtime]
    paths:
      - 'docs/aid-system/tools/audit_effect_contracts.py'
      - '.github/workflows/aid-effect-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aid-design-handoff-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  final-design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/programmable-aids-runtime
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated documentation validators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aid-typescript"
          printf '%s\n' '{"private":true,"devDependencies":{"typescript":"5.6.3"}}' > "$RUNNER_TEMP/aid-typescript/package.json"
          bun install --cwd "$RUNNER_TEMP/aid-typescript" --ignore-scripts
          python -m pip install --disable-pip-version-check --only-binary=:all: --target "$RUNNER_TEMP/aid-python" jsonschema==4.23.0 attrs==24.2.0 referencing==0.35.1 rpds-py==0.20.0 jsonschema-specifications==2024.10.1
          printf 'AID_TYPESCRIPT_PATH=%s\n' "$RUNNER_TEMP/aid-typescript/node_modules/typescript/lib/typescript.js" >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s\n' "$RUNNER_TEMP/aid-python" >> "$GITHUB_ENV"
      - name: Complete base documentation and primary-reference retrieval records
        run: python docs/aid-system/tools/complete_handoff.py --root . --write --research
      - name: Validate typed results and replay protection after retention
        run: python docs/aid-system/tools/audit_effect_contracts.py --root . --write
      - name: Assert both validation paths are read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('docs/aid-system').rglob('*') if p.is_file() and '__pycache__' not in p.parts}
          Path('/tmp/aid-final-before.json').write_text(json.dumps(rows,sort_keys=True))
          PY
          python docs/aid-system/tools/complete_handoff.py --root . --check
          python docs/aid-system/tools/audit_effect_contracts.py --root . --check
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('docs/aid-system').rglob('*') if p.is_file() and '__pycache__' not in p.parts}
          assert rows==json.loads(Path('/tmp/aid-final-before.json').read_text()), 'Read-only audit mutated sources'
          PY
      - name: Export and verify the actual complete corpus
        run: python docs/aid-system/tools/complete_handoff.py --root . --check --export-dir build/aid-design-handoff
      - name: Publish documentation-only changes without force
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed=('docs/aid-system/','docs/computer-use-aid-design-index.md','docs/computer-use-aid-design-work-log.md','docs/computer-use-aid-environment-design.md','docs/computer-use-programmable-aids.md','docs/computer-use-current-platform-opportunities-2026-09.md','.agent/CONTINUITY.md','AGENTS.md')
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(p.startswith(allowed) for p in changed), changed
          PY
          git add docs/aid-system docs/computer-use-aid-design-index.md docs/computer-use-aid-design-work-log.md docs/computer-use-aid-environment-design.md docs/computer-use-programmable-aids.md docs/computer-use-current-platform-opportunities-2026-09.md .agent/CONTINUITY.md AGENTS.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs(aids): finalize checked SDK responses, retention semantics and handoff'
            git push origin HEAD:refs/heads/feat/programmable-aids-runtime
          fi
          git rev-parse HEAD > build/aid-design-handoff/BRANCH-COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aid-final-contract-handoff-v1.1
          path: |
            build/aid-design-handoff/
            docs/aid-system/design-validation.json
            docs/aid-system/research/source-checks.json
          if-no-files-found: error
          retention-days: 14
