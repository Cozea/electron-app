name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing git tag to build (for example v0.2.0)"
        required: true
        type: string
      publish:
        description: "Publish installers and runtime assets to the release repository"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096
  # Set to "1" to build unsigned even when signing secrets exist, without having to
  # delete a certificate that may still be wanted later.
  COZEA_FORCE_UNSIGNED_MAC: ${{ vars.COZEA_FORCE_UNSIGNED_MAC }}
  COZEA_RELEASE_REPO: ${{ vars.COZEA_RELEASE_REPO || 'cozea-prod' }}
  COZEA_RUNTIME_RELEASE_REPO: ${{ github.repository_owner }}/${{ vars.COZEA_RELEASE_REPO || 'cozea-prod' }}
  COZEA_GIT_BUNDLE_RELEASE_REPO: ${{ github.repository_owner }}/${{ vars.COZEA_RELEASE_REPO || 'cozea-prod' }}
  COZEA_GIT_BUNDLE_URL_DARWIN_ARM64: ${{ secrets.COZEA_GIT_BUNDLE_URL_DARWIN_ARM64 }}
  COZEA_GIT_BUNDLE_URL_DARWIN_X64: ${{ secrets.COZEA_GIT_BUNDLE_URL_DARWIN_X64 }}
  COZEA_GIT_BUNDLE_URL_WIN32_X64: ${{ secrets.COZEA_GIT_BUNDLE_URL_WIN32_X64 }}
  COZEA_GIT_BUNDLE_URL_WIN32_ARM64: ${{ secrets.COZEA_GIT_BUNDLE_URL_WIN32_ARM64 }}
  COZEA_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.COZEA_RUNTIME_SIGNING_PRIVATE_KEY }}
  COZEA_RUNTIME_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.COZEA_RUNTIME_SIGNING_PRIVATE_KEY_PATH }}
  COZEA_RUNTIME_SIGNING_PUBLIC_KEY: ${{ secrets.COZEA_RUNTIME_SIGNING_PUBLIC_KEY }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GITHUB_TOKEN: ${{ github.token }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CSC_LINK: ${{ secrets.CSC_LINK }}
  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
  VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || vars.VITE_CONVEX_URL }}
  VITE_AI_API_URL: ${{ secrets.VITE_AI_API_URL || vars.VITE_AI_API_URL }}
  VITE_FF_DATA_ROUTER: "1"
  VITE_FF_VIEW_TRANSITIONS: "1"
  VITE_FF_PRIORITIZED_SCHEDULING: "1"
  VITE_FF_REACT_COMPILER: "1"
  VITE_FF_ROLLDOWN_BUILD: "1"
  VITE_FF_JANK_DIAGNOSTICS: "1"
  VITE_FF_CONTENT_VISIBILITY: "1"
  VITE_FF_OFFSCREEN_SCREENSHOT: "1"
  VITE_FF_UTILITY_PROCESS_MANIFEST: "1"

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      publish_mode: ${{ steps.plan.outputs.publish_mode }}
      release_lane: ${{ steps.plan.outputs.release_lane }}
      updater_channel: ${{ steps.plan.outputs.updater_channel }}
      github_release_type: ${{ steps.plan.outputs.github_release_type }}
    steps:
      - name: Resolve release inputs
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            checkout_ref="${GITHUB_REF}"
            publish_mode="always"
          else
            release_tag="${{ inputs.release_tag }}"
            checkout_ref="refs/tags/${release_tag}"
            if [[ "${{ inputs.publish }}" == "true" ]]; then
              publish_mode="always"
            else
              publish_mode="never"
            fi
          fi

          if [[ ! "${release_tag}" =~ ^v ]]; then
            echo "::error::Release tag must start with v (received ${release_tag})."
            exit 1
          fi

          version="${release_tag#v}"
          release_lane="stable"
          updater_channel="latest"
          github_release_type="release"

          case "${version}" in
            *-beta.*|*-beta)
              release_lane="beta"
              updater_channel="beta"
              github_release_type="prerelease"
              ;;
            *-canary.*|*-canary)
              release_lane="canary"
              # Electron Builder's documented prerelease ladder is latest/beta/alpha.
              # We expose "canary" at the product level, but publish it on the alpha
              # updater channel to preserve prerelease update behavior.
              updater_channel="alpha"
              github_release_type="prerelease"
              ;;
            *-*)
              echo "::error::Unsupported prerelease tag ${release_tag}. Use stable, beta, or canary only."
              exit 1
              ;;
          esac

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "publish_mode=${publish_mode}" >> "$GITHUB_OUTPUT"
          echo "release_lane=${release_lane}" >> "$GITHUB_OUTPUT"
          echo "updater_channel=${updater_channel}" >> "$GITHUB_OUTPUT"
          echo "github_release_type=${github_release_type}" >> "$GITHUB_OUTPUT"

      - name: Release summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release plan

          - Release tag: \`${{ steps.plan.outputs.release_tag }}\`
          - Release lane: \`${{ steps.plan.outputs.release_lane }}\`
          - Updater channel: \`${{ steps.plan.outputs.updater_channel }}\`
          - GitHub release type: \`${{ steps.plan.outputs.github_release_type }}\`
          - Checkout ref: \`${{ steps.plan.outputs.checkout_ref }}\`
          - Publish mode: \`${{ steps.plan.outputs.publish_mode }}\`
          EOF

  verify:
    name: Verify release candidate
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COZEA_RUNTIME_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      COZEA_GIT_BUNDLE_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      COZEA_RELEASE_LANE: ${{ needs.plan.outputs.release_lane }}
      COZEA_UPDATER_CHANNEL: ${{ needs.plan.outputs.updater_channel }}
      COZEA_GITHUB_RELEASE_TYPE: ${{ needs.plan.outputs.github_release_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.plan.outputs.checkout_ref }}
          # typecheck:electron resolves imports out of vendor/t3code, so the
          # substrate must be present here too, not only in the build job.
          # Submodule init is done manually below (see next step) rather than
          # via this input's built-in submodule handling.
          submodules: false

      - name: Checkout vendored substrate
        shell: bash
        run: git submodule update --init vendor/t3code

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache vendored T3 substrate
        uses: actions/cache@v4
        with:
          path: |
            vendor/t3code/node_modules
            vendor/t3code/apps/server/dist
          key: t3-${{ runner.os }}-${{ hashFiles('docs/substrate-t3-pin.md') }}

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${{ needs.plan.outputs.release_tag }}" != "${expected_tag}" ]]; then
            echo "::error::Release tag ${{ needs.plan.outputs.release_tag }} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Validate shared release build env
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in VITE_CONVEX_URL VITE_AI_API_URL; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required build environment values: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run postinstall

      - name: Prepare runtime metadata
        run: bun run prepare:runtime-metadata

      - name: Sign runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${COZEA_RUNTIME_SIGNING_PRIVATE_KEY:-}" || -n "${COZEA_RUNTIME_SIGNING_PRIVATE_KEY_PATH:-}" ]]; then
            bun run sign:runtime-metadata
          else
            echo "::warning::Runtime signing key not configured; runtime metadata signatures were not generated."
          fi

      - name: Prepare vendored substrate
        run: bun run prepare:t3-runtime

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck electron
        run: bun run typecheck:electron

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Lint
        run: bun run lint


  build:
    name: ${{ matrix.name }}
    needs:
      - plan
      - verify
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            artifact_name: macos-arm64
            # devapp-container-runtime declares swift-tools-version 6.2 and
            # platforms: [.macOS(.v26)], which needs the Xcode 26 toolchain
            # only the macos-26 image ships.
            runs_on: macos-26
            electron_target: mac
            arch: arm64
            git_bundle_targets: darwin-arm64
            runtime_bundle_targets: darwin-arm64
          - name: macOS x64
            artifact_name: macos-x64
            # GitHub's macos-26 pool is Apple Silicon, so the x64 package is
            # cross-built from the same pool with an x64 target.
            runs_on: macos-26
            electron_target: mac
            arch: x64
            git_bundle_targets: darwin-x64
            runtime_bundle_targets: darwin-x64
    env:
      COZEA_RUNTIME_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      COZEA_GIT_BUNDLE_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      COZEA_GIT_BUNDLE_TARGETS: ${{ matrix.git_bundle_targets }}
      COZEA_RUNTIME_BUNDLE_TARGETS: ${{ matrix.runtime_bundle_targets }}
      COZEA_RELEASE_LANE: ${{ needs.plan.outputs.release_lane }}
      COZEA_UPDATER_CHANNEL: ${{ needs.plan.outputs.updater_channel }}
      COZEA_GITHUB_RELEASE_TYPE: ${{ needs.plan.outputs.github_release_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.plan.outputs.checkout_ref }}
          # Submodule init is done manually below (see next step) rather than
          # via this input's built-in submodule handling.
          submodules: false

      - name: Checkout vendored substrate
        shell: bash
        run: git submodule update --init vendor/t3code

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache vendored T3 substrate
        uses: actions/cache@v4
        with:
          path: |
            vendor/t3code/node_modules
            vendor/t3code/apps/server/dist
          key: t3-${{ runner.os }}-${{ hashFiles('docs/substrate-t3-pin.md') }}

      - name: Validate shared release build env
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in VITE_CONVEX_URL VITE_AI_API_URL; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required build environment values: ${missing[*]}"
            exit 1
          fi

      - name: Validate publish credentials
        if: needs.plan.outputs.publish_mode == 'always'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing GH_TOKEN for publishing to ${COZEA_RUNTIME_RELEASE_REPO}."
            exit 1
          fi

      - name: Resolve macOS signing mode
        if: matrix.electron_target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          # Both a Developer ID certificate and notarization require a paid Apple
          # Developer Program membership. Cozea ships free, so the release has to
          # produce usable artifacts without one: fall back to an unsigned build
          # instead of failing the job, and let the later signing, verification
          # and notarization steps opt out on this flag.
          if [[ "${COZEA_FORCE_UNSIGNED_MAC:-}" == "1" ]]; then
            echo "COZEA_MAC_SIGNING=0" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "COZEA_SKIP_NOTARIZE=1" >> "$GITHUB_ENV"
            echo "COZEA_ALLOW_UNSIGNED_GIT_BUNDLES=1" >> "$GITHUB_ENV"
            echo "::warning::COZEA_FORCE_UNSIGNED_MAC is set; ignoring any signing certificate and producing an unsigned build."
          elif [[ -n "${CSC_LINK:-}" && -n "${CSC_KEY_PASSWORD:-}" ]]; then
            echo "COZEA_MAC_SIGNING=1" >> "$GITHUB_ENV"
            echo "Signing certificate configured; producing a signed build."
          else
            echo "COZEA_MAC_SIGNING=0" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "COZEA_SKIP_NOTARIZE=1" >> "$GITHUB_ENV"
            echo "COZEA_ALLOW_UNSIGNED_GIT_BUNDLES=1" >> "$GITHUB_ENV"
            echo "::warning::No macOS signing certificate configured; producing an unsigned build. Downloaders must bypass Gatekeeper on first launch."
          fi

      - name: Validate macOS publish secrets
        if: matrix.electron_target == 'mac' && needs.plan.outputs.publish_mode == 'always' && env.COZEA_MAC_SIGNING == '1'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required macOS publish secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run postinstall

      - name: Cache Swift build products (container runtime)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: native/devapp-container-runtime/.build
          key: swift-devapp-runtime-${{ runner.os }}-${{ hashFiles('native/devapp-container-runtime/Package.resolved', 'native/devapp-container-runtime/Package.swift', 'native/devapp-container-runtime/Sources/**') }}
          restore-keys: |
            swift-devapp-runtime-${{ runner.os }}-

      - name: Cache Swift build products (local automation)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: native/local-automation-helper/.build
          key: swift-local-automation-${{ runner.os }}-${{ hashFiles('native/local-automation-helper/Package.swift', 'native/local-automation-helper/Sources/**') }}
          restore-keys: |
            swift-local-automation-${{ runner.os }}-

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install autoconf

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.COZEA_MAC_SIGNING == '1'
        shell: bash
        run: |
          set -euo pipefail

          cert_path="${RUNNER_TEMP}/cozea-signing-cert.p12"
          if [[ "${CSC_LINK}" == http://* || "${CSC_LINK}" == https://* ]]; then
            curl -fsSL "${CSC_LINK}" -o "${cert_path}"
          elif [[ "${CSC_LINK}" == file://* ]]; then
            cp "${CSC_LINK#file://}" "${cert_path}"
          elif [[ -f "${CSC_LINK}" ]]; then
            cp "${CSC_LINK}" "${cert_path}"
          else
            payload="${CSC_LINK#base64:}"
            if [[ "${payload}" == data:* ]]; then
              payload="${payload#*,}"
            fi
            printf '%s' "${payload}" | base64 --decode > "${cert_path}" 2>/dev/null || printf '%s' "${payload}" | base64 -D > "${cert_path}"
          fi

          keychain_path="${RUNNER_TEMP}/cozea-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"

          existing_keychains="$(security list-keychains -d user | sed 's/[ \"]//g' | tr '\n' ' ')"
          security list-keychains -d user -s "${keychain_path}" ${existing_keychains}
          security default-keychain -d user -s "${keychain_path}"

          security import "${cert_path}" -k "${keychain_path}" -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"

          identity_full="$(security find-identity -v -p codesigning "${keychain_path}" | awk -F\\\" '/Developer ID Application:/{print $2; exit}')"
          if [[ -z "${identity_full}" ]]; then
            echo "::error::No Developer ID Application identity found in imported signing certificate."
            exit 1
          fi

          identity_common="${identity_full#Developer ID Application: }"
          echo "COZEA_CODESIGN_IDENTITY=${identity_full}" >> "$GITHUB_ENV"
          echo "CSC_NAME=${identity_common}" >> "$GITHUB_ENV"

      - name: Prepare runtime metadata
        run: bun run prepare:runtime-metadata

      - name: Sign runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${COZEA_RUNTIME_SIGNING_PRIVATE_KEY:-}" || -n "${COZEA_RUNTIME_SIGNING_PRIVATE_KEY_PATH:-}" ]]; then
            bun run sign:runtime-metadata
          else
            echo "::warning::Runtime signing key not configured; runtime metadata signatures were not generated."
          fi

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail

          # electron-builder copies the t3 runtime's pnpm-store node_modules
          # (many thousands of small files) into the app bundle; macOS's
          # default open-file limit (256) is nowhere near enough for that
          # and the copy fails with EMFILE partway through. Raising ulimit -n
          # alone still hit the same ceiling, since the launchd session caps
          # what a plain ulimit can request; raise that ceiling first.
          sudo launchctl limit maxfiles 65536 200000 2>/dev/null || true
          ulimit -n 65536 2>/dev/null || ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          echo "open-file limit: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"

          max_attempts=2
          success=0

          for attempt in $(seq 1 "${max_attempts}"); do
            log_file="$(mktemp)"
            echo "Build/package attempt ${attempt}/${max_attempts}"

            dist_cmd=(bun run dist -- --${{ matrix.electron_target }} --${{ matrix.arch }} --publish ${{ needs.plan.outputs.publish_mode }})

            if "${dist_cmd[@]}" 2>&1 | tee "${log_file}"; then
              success=1
              break
            fi

            if [[ "${attempt}" -lt "${max_attempts}" ]] && grep -Eqi 'NSURLErrorDomain Code=-1009|Internet connection appears to be offline|appstoreconnect\\.apple\\.com/notary|Failed to notarize via notarytool' "${log_file}"; then
              echo "::warning::Transient notarization/network failure detected on attempt ${attempt}/${max_attempts}. Retrying once."
              rm -rf dist
              sleep 20
              continue
            fi

            echo "::error::Build/package failed on attempt ${attempt}/${max_attempts}."
            exit 1
          done

          if [[ "${success}" -ne 1 ]]; then
            echo "::error::Build/package did not succeed after ${max_attempts} attempts."
            exit 1
          fi

      - name: Verify macOS app bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          found_app=0
          while IFS= read -r app_path; do
            found_app=1
            echo "Verifying app bundle: ${app_path}"

            if [[ "${COZEA_MAC_SIGNING:-1}" != "1" ]]; then
              # An unsigned build carries at most an ad-hoc signature, which
              # Gatekeeper never accepts, so the assertions below would all fail by
              # design. Check the bundle is structurally intact instead.
              test -d "${app_path}/Contents/MacOS"
              echo "Unsigned build: skipped signature, Gatekeeper and staple checks."
              continue
            fi

            codesign --verify --deep --strict --verbose=2 "${app_path}"

            if [[ "${{ needs.plan.outputs.publish_mode }}" == "always" ]]; then
              spctl --assess --type execute --verbose=4 "${app_path}"
              xcrun stapler validate "${app_path}"
            fi
          done < <(find dist -maxdepth 4 -type d -name '*.app' ! -path '*/Contents/Frameworks/*')

          if [[ "${found_app}" -eq 0 ]]; then
            echo "::error::No .app bundle found in dist/ for signature verification."
            exit 1
          fi

      - name: Notarize and staple DMG
        if: runner.os == 'macOS' && needs.plan.outputs.publish_mode == 'always' && env.COZEA_MAC_SIGNING == '1'
        shell: bash
        run: |
          set -euo pipefail

          found_dmg=0
          while IFS= read -r dmg_path; do
            found_dmg=1
            echo "Submitting DMG for notarization: ${dmg_path}"
            dmg_notarized=0

            for dmg_attempt in 1 2; do
              set +e
              dmg_submit_output="$(
                xcrun notarytool submit "${dmg_path}" \
                  --apple-id "${APPLE_ID}" \
                  --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
                  --team-id "${APPLE_TEAM_ID}" \
                  --wait \
                  --output-format json 2>&1
              )"
              dmg_submit_exit=$?
              set -e

              printf '%s\n' "${dmg_submit_output}"

              dmg_submission_id="$(printf '%s\n' "${dmg_submit_output}" | sed -nE 's/.*"id"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' | head -n1)"
              dmg_submission_status="$(printf '%s\n' "${dmg_submit_output}" | sed -nE 's/.*"status"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' | head -n1)"
              dmg_submission_status_lc="$(printf '%s' "${dmg_submission_status}" | tr '[:upper:]' '[:lower:]')"

              if [[ "${dmg_submit_exit}" -eq 0 && "${dmg_submission_status_lc}" == "accepted" ]]; then
                dmg_notarized=1
                break
              fi

              if [[ -n "${dmg_submission_id}" ]]; then
                echo "::group::DMG notary log ${dmg_submission_id}"
                xcrun notarytool log "${dmg_submission_id}" --apple-id "${APPLE_ID}" --password "${APPLE_APP_SPECIFIC_PASSWORD}" --team-id "${APPLE_TEAM_ID}" || true
                echo "::endgroup::"
              fi

              if [[ "${dmg_attempt}" -lt 2 ]]; then
                echo "::warning::DMG notarization attempt ${dmg_attempt}/2 failed for ${dmg_path}; retrying once."
                sleep 20
              fi
            done

            if [[ "${dmg_notarized}" -ne 1 ]]; then
              echo "::error::DMG notarization failed for ${dmg_path}."
              exit 1
            fi

            xcrun stapler staple "${dmg_path}"
            xcrun stapler validate "${dmg_path}"
          done < <(find dist -maxdepth 5 -type f -name '*.dmg')

          if [[ "${found_dmg}" -eq 0 ]]; then
            echo "::warning::No DMG artifact found in dist/ to validate."
          fi

      - name: Upload runtime assets to release
        if: needs.plan.outputs.publish_mode == 'always'
        shell: bash
        run: |
          set -euo pipefail

          repo="${{ env.COZEA_RUNTIME_RELEASE_REPO }}"
          tag="${{ needs.plan.outputs.release_tag }}"
          target="${{ matrix.git_bundle_targets }}"
          tmp_dir="$(mktemp -d)"
          assets=()

          if [[ -f "build/runtime/capability-catalog.json" ]]; then
            cp "build/runtime/capability-catalog.json" "${tmp_dir}/capability-catalog-${target}.json"
            assets+=("${tmp_dir}/capability-catalog-${target}.json")
          fi

          if [[ -f "build/runtime/capability-catalog.sig" ]]; then
            cp "build/runtime/capability-catalog.sig" "${tmp_dir}/capability-catalog-${target}.sig"
            assets+=("${tmp_dir}/capability-catalog-${target}.sig")
          fi

          if [[ -f "build/runtime/runtime-public-key.pem" ]]; then
            cp "build/runtime/runtime-public-key.pem" "${tmp_dir}/runtime-public-key-${target}.pem"
            assets+=("${tmp_dir}/runtime-public-key-${target}.pem")
          fi

          if [[ ${#assets[@]} -gt 0 ]]; then
            gh release upload "${tag}" "${assets[@]}" --repo "${repo}" --clobber
          else
            echo "::warning::No runtime assets found to upload."
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.release_tag }}-${{ matrix.artifact_name }}
          path: dist/**
          if-no-files-found: warn
          retention-days: 14
