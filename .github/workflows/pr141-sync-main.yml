name: PR141 synchronize latest main

on:
  push:
    branches:
      - integration/pr141-main-port
    paths:
      - .github/workflows/pr141-sync-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr141-sync-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Merge latest main
        run: |
          git config user.name 'Cozea collaboration port'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:integration/pr141-main-port
