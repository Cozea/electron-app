name: Collaboration completion implementation

on:
  push:
    branches: [codex/collaboration-v2-complete]
    paths:
      - scripts/collaboration-completion-patch.mjs
      - .github/workflows/collaboration-completion-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collaboration-completion-implementation
  cancel-in-progress: false

env:
  VITE_GITHUB_COLLABORATION_RELEASE: "0"
  COLLABORATION_G3_CREATE_ENABLED: "0"

jobs:
  implement:
    if: github.ref == 'refs/heads/codex/collaboration-v2-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate exact edit anchors without writes
        run: bun scripts/collaboration-completion-patch.mjs --check
      - name: Apply scoped edits in the isolated checkout
        run: bun scripts/collaboration-completion-patch.mjs
      - name: Bootstrap pinned runtime
        run: bun run bootstrap
      - name: Inspect native authorization entry points
        run: |
          find vendor/t3code/apps/server/src -iname '*rpc*' -o -iname '*providerService*' -o -iname '*continuation*'
          grep -R -l 'dispatchCommand' vendor/t3code/apps/server/src --include='*.ts' | head -40
      - name: Install Electron runtime for tests
        run: node node_modules/electron/install.js
      - name: Typecheck renderer
        run: bun run typecheck
      - name: Typecheck Electron
        run: bun run typecheck:electron
      - name: Typecheck tests
        run: bun run typecheck:tests
      - name: Typecheck Worker
        run: bun run typecheck:cloudflare
      - name: Lint
        run: bun run lint
      - name: Behavioral tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Commit only verified scoped changes
        run: |
          git add -- apps/desktop/electron/substrate/ShadowServerManager.ts apps/server/src/t3/process.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: await confirmed native process exit before completing shutdown'
          git push origin HEAD:refs/heads/codex/collaboration-v2-complete
