name: PR141 sync current main

on:
  push:
    branches:
      - integration/pr141-main-port
    paths:
      - .github/workflows/pr141-main-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr141-sync-current-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Merge current main and preserve collaboration session behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cozea collaboration integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_code=$?
          set -e

          if [ "$merge_code" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected='apps/desktop/src/features/projects/layouts/ProjectLayout.tsx'
            if [ "$conflicts" != "$expected" ]; then
              echo 'Unexpected merge conflicts:'
              printf '%s\n' "$conflicts"
              git diff --cc
              exit 1
            fi
            git checkout --theirs -- "$expected"
            python3 scripts/pr141-main-merge-resolve.py
            git add "$expected"
          fi

          git diff --check
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain:'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m 'merge: synchronize collaboration v2 with current main'
          git push origin HEAD:integration/pr141-main-port
