name: Computer Use Source Import
on:
  push:
    branches: [feat/macos-computer-use-v2]
    paths: ['.cu-transfer/ready.json']
permissions:
  contents: write
concurrency:
  group: cu-source-import
  cancel-in-progress: false
jobs:
  import-and-build:
    if: github.repository == 'Cozea/electron-app' && github.ref == 'refs/heads/feat/macos-computer-use-v2'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Apply hash-verified integration patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.cu-transfer/ready.json').read_text())
          assert manifest['format'] == 'git-patch-v1'
          assert 0 < manifest['parts'] <= 30
          encoded = ''.join((root / f'.cu-transfer/integration-{i}.txt').read_text().strip() for i in range(manifest['parts']))
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) < 2_000_000
          assert hashlib.sha256(raw).hexdigest() == manifest['sha256']
          stats = subprocess.check_output(['git', 'apply', '--numstat', '-z', '-'], input=raw)
          paths = [entry.split(b'\t', 2)[2].decode() for entry in stats.split(b'\0') if entry]
          for name in paths:
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert '.git' not in p.parts and '.build' not in p.parts
              assert name.startswith(('native/computer-use-runtime/', 'native/computer-use-bridge/', 'packages/computer-use-native/', 'tests/computer-use/', 'scripts/', 'docs/', 'apps/desktop/', 'shared/')) or name in ('package.json', 'bun.lock', 'AGENTS.md')
          subprocess.run(['git', 'apply', '--check', '-'], input=raw, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=raw, check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Commit readable source on the implementation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(computer-use): integrate ABI 2 policy, host lifecycle, fixtures and validation'
            git push origin HEAD:feat/macos-computer-use-v2
          fi
      - name: Native unit tests and fixture build
        run: |
          mkdir -p build/cu-validation
          set -o pipefail
          xcrun swift test --package-path native/computer-use-runtime 2>&1 | tee build/cu-validation/native-test.log
      - name: Build C ABI bridge
        if: always()
        run: |
          mkdir -p build/cu-validation
          set -o pipefail
          xcrun swift build --package-path native/computer-use-bridge 2>&1 | tee build/cu-validation/native-bridge.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computer-use-native-validation
          path: build/cu-validation/*.log
          retention-days: 7
