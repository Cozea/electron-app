definitions:
  environment:
    release_env: &release_env
      groups:
        - cozea-release
      vars:
        CI: "true"
        NODE_OPTIONS: "--max-old-space-size=4096"
        COZEA_UPDATE_PROVIDER: "generic"
        COZEA_UPDATER_CHANNEL: "latest"
        VITE_FF_DATA_ROUTER: "1"
        VITE_FF_VIEW_TRANSITIONS: "1"
        VITE_FF_PRIORITIZED_SCHEDULING: "1"
        VITE_FF_REACT_COMPILER: "1"
        VITE_FF_ROLLDOWN_BUILD: "1"
        VITE_FF_JANK_DIAGNOSTICS: "1"
        VITE_FF_CONTENT_VISIBILITY: "1"
        VITE_FF_OFFSCREEN_SCREENSHOT: "1"
        VITE_FF_UTILITY_PROCESS_MANIFEST: "1"

  triggering:
    main_push: &main_push
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: v*
          include: true
      cancel_previous_builds: true

workflows:
  release-macos-r2:
    name: Release macOS to Cloudflare R2
    instance_type: mac_mini_m4
    max_build_duration: 120
    environment: *release_env
    triggering: *main_push
    scripts:
      - name: Install macOS build dependencies
        script: |
          set -euo pipefail
          brew update
          brew install autoconf
          softwareupdate --install-rosetta --agree-to-license || true

      - name: Install Bun and dependencies
        script: |
          set -euo pipefail
          curl -fsSL https://bun.com/install | bash -s "bun-v1.3.13"
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          if ! command -v bunx >/dev/null 2>&1; then
            printf '#!/usr/bin/env bash\nexec bun x "$@"\n' > "$BUN_INSTALL/bin/bunx"
            chmod +x "$BUN_INSTALL/bin/bunx"
          fi
          bun --version
          bun install --frozen-lockfile

      - name: Validate release environment
        script: |
          set -euo pipefail
          missing=()
          for name in VITE_CONVEX_URL VITE_AI_API_URL COZEA_UPDATE_BASE_URL COZEA_UPDATE_BUCKET CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required Codemagic release environment values: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare and sign runtime metadata
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun run prepare:runtime-metadata
          if [[ -n "${COZEA_RUNTIME_SIGNING_PRIVATE_KEY:-}" || -n "${COZEA_RUNTIME_SIGNING_PRIVATE_KEY_PATH:-}" ]]; then
            bun run sign:runtime-metadata
          else
            echo "Runtime signing key not configured; runtime metadata signatures were not generated."
          fi

      - name: Import Developer ID certificate
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          export BASH_ENV="$CM_BUILD_DIR/.codemagic_bash_env"
          touch "$BASH_ENV"
          bash scripts/ci/import-macos-certificate.sh

      - name: Build signed separate macOS releases
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          source "$CM_BUILD_DIR/.codemagic_bash_env"
          bun run dist -- --mac --x64 --arm64 --publish never

      - name: Notarize and verify macOS artifacts
        script: |
          set -euo pipefail
          bash scripts/ci/notarize-dmgs.sh
          while IFS= read -r app_path; do
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
            xcrun stapler validate "$app_path"
          done < <(find dist -maxdepth 4 -type d -name '*.app' ! -path '*/Contents/Frameworks/*')

      - name: Upload macOS artifacts to Cloudflare R2
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          mkdir -p ci-artifacts/macos
          cp -R dist ci-artifacts/macos/dist
          bash scripts/ci/upload-circleci-artifacts-to-r2.sh
    artifacts:
      - dist/**/*.dmg
      - dist/**/*.zip
      - dist/**/*.yml
      - dist/**/*.yaml
      - dist/**/*.blockmap

  release-windows-r2:
    name: Release Windows to Cloudflare R2
    instance_type: windows_x2
    max_build_duration: 120
    environment: *release_env
    triggering: *main_push
    scripts:
      - name: Build Windows release and upload to Cloudflare R2
        script: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSVersion.Major -ge 7 -and $PSVersionTable.PSVersion.Minor -ge 3) {
            $PSNativeCommandUseErrorActionPreference = $true
          }

          function Assert-LastExitCode([string]$step) {
            if ($LASTEXITCODE -ne 0) {
              throw "$step failed with exit code $LASTEXITCODE"
            }
          }

          $required = @(
            "VITE_CONVEX_URL",
            "VITE_AI_API_URL",
            "COZEA_UPDATE_BASE_URL",
            "COZEA_UPDATE_BUCKET",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN"
          )
          $missing = @()
          foreach ($name in $required) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing required Codemagic release environment values: $($missing -join ', ')"
          }

          function Resolve-PythonPath {
            $candidates = @(
              "C:\Python312\python.exe",
              "C:\Python311\python.exe",
              "C:\Program Files\Python312\python.exe",
              "C:\Program Files\Python311\python.exe",
              "$env:USERPROFILE\AppData\Local\Programs\Python\Python312\python.exe",
              "$env:USERPROFILE\AppData\Local\Programs\Python\Python311\python.exe",
              (Get-Command python -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source),
              (Get-Command python3 -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
            ) | Where-Object { $_ -and (Test-Path $_) }

            foreach ($candidate in $candidates) {
              try {
                & $candidate --version | Out-Null
                if ($LASTEXITCODE -eq 0) {
                  return $candidate
                }
              } catch {
                continue
              }
            }

            return $null
          }

          $pythonPath = Resolve-PythonPath
          if (-not $pythonPath) {
            choco install python --version=3.12.8 -y --no-progress
            Assert-LastExitCode "choco install python"
            $env:Path = "C:\Python312;C:\Python312\Scripts;$env:Path"
            $pythonPath = Resolve-PythonPath
          }
          if (-not $pythonPath) {
            throw "Python was installed but no usable python.exe was found for node-gyp."
          }
          $env:PYTHON = $pythonPath
          Write-Host "Using Python for node-gyp: $pythonPath"

          iex "& {$(irm https://bun.com/install.ps1)} -Version 1.3.13"
          $env:Path = "$env:USERPROFILE\.bun\bin;$env:Path"
          bun --version
          Assert-LastExitCode "bun --version"
          if (Get-Command npm -ErrorAction SilentlyContinue) {
            npm config set python "$pythonPath"
            Assert-LastExitCode "npm config set python"
          }
          bun install --frozen-lockfile
          Assert-LastExitCode "bun install --frozen-lockfile"

          bun run prepare:runtime-metadata
          Assert-LastExitCode "bun run prepare:runtime-metadata"
          if ($env:COZEA_RUNTIME_SIGNING_PRIVATE_KEY -or $env:COZEA_RUNTIME_SIGNING_PRIVATE_KEY_PATH) {
            bun run sign:runtime-metadata
            Assert-LastExitCode "bun run sign:runtime-metadata"
          } else {
            Write-Host "Runtime signing key not configured; runtime metadata signatures were not generated."
          }

          bun run dist -- --win --x64 --publish never
          Assert-LastExitCode "bun run dist -- --win --x64 --publish never"

          New-Item -ItemType Directory -Force ci-artifacts/windows-x64 | Out-Null
          Copy-Item -Recurse dist ci-artifacts/windows-x64/dist

          $env:WRANGLER_SEND_METRICS = "false"
          $bucket = if ($env:COZEA_UPDATE_BUCKET) { $env:COZEA_UPDATE_BUCKET } else { "cozea-updates" }
          $channel = if ($env:COZEA_UPDATER_CHANNEL) { $env:COZEA_UPDATER_CHANNEL } else { "latest" }
          $prefix = if ($env:COZEA_UPDATE_PREFIX) { $env:COZEA_UPDATE_PREFIX.TrimEnd("/") + "/" } else { "" }
          $allowedExtensions = @(".yml", ".yaml", ".zip", ".dmg", ".exe", ".blockmap")

          function Get-ContentType([string]$fileName) {
            if ($fileName -like "*.yml" -or $fileName -like "*.yaml") { return "text/yaml" }
            if ($fileName -like "*.zip") { return "application/zip" }
            if ($fileName -like "*.dmg") { return "application/x-apple-diskimage" }
            if ($fileName -like "*.exe") { return "application/vnd.microsoft.portable-executable" }
            return "application/octet-stream"
          }

          function Get-CacheControl([string]$fileName) {
            if ($fileName -like "latest*.yml" -or $fileName -like "*.yml" -or $fileName -like "*.yaml") {
              return "public, max-age=60, must-revalidate"
            }
            return "public, max-age=31536000, immutable"
          }

          $files = Get-ChildItem -Path ci-artifacts -Recurse -File |
            Where-Object { $allowedExtensions -contains $_.Extension.ToLowerInvariant() } |
            Sort-Object FullName

          if ($files.Count -eq 0) {
            throw "No release artifacts found under ci-artifacts."
          }

          foreach ($file in $files) {
            $fileName = $file.Name
            $objectKey = "$prefix$channel/$fileName"
            $contentType = Get-ContentType $fileName
            $cacheControl = Get-CacheControl $fileName
            Write-Host "Uploading $($file.FullName) to r2://$bucket/$objectKey"
            bunx wrangler r2 object put "$bucket/$objectKey" `
              --file "$($file.FullName)" `
              --content-type "$contentType" `
              --cache-control "$cacheControl" `
              --remote
            Assert-LastExitCode "bunx wrangler r2 object put $bucket/$objectKey"
          }
    artifacts:
      - dist/**/*.exe
      - dist/**/*.yml
      - dist/**/*.yaml
      - dist/**/*.blockmap
