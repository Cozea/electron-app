version: 2.1

executors:
  linux-node:
    docker:
      - image: cimg/node:lts
    resource_class: large

commands:
  install_bun_unix:
    steps:
      - run:
          name: Install Bun
          command: |
            set -euo pipefail
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            if ! command -v bunx >/dev/null 2>&1; then
              printf '#!/usr/bin/env bash\nexec bun x "$@"\n' > "$BUN_INSTALL/bin/bunx"
              chmod +x "$BUN_INSTALL/bin/bunx"
            fi
            bun --version

  install_dependencies_unix:
    steps:
      - install_bun_unix
      - run:
          name: Install dependencies
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            bun install --frozen-lockfile

  checkout_with_t3_submodule:
    steps:
      - checkout:
          submodules: true
      - run:
          name: Sync vendor/t3code pin
          command: node scripts/vendor/sync-t3code-pin.mjs

  install_pnpm_unix:
    steps:
      - run:
          name: Enable pnpm (corepack)
          command: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@10.28.2 --activate
            pnpm --version

jobs:
  verify:
    executor: linux-node
    environment:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_FF_DATA_ROUTER: "1"
      VITE_FF_VIEW_TRANSITIONS: "1"
      VITE_FF_PRIORITIZED_SCHEDULING: "1"
      VITE_FF_REACT_COMPILER: "1"
      VITE_FF_ROLLDOWN_BUILD: "1"
      VITE_FF_JANK_DIAGNOSTICS: "1"
      VITE_FF_CONTENT_VISIBILITY: "1"
      VITE_FF_OFFSCREEN_SCREENSHOT: "1"
      VITE_FF_UTILITY_PROCESS_MANIFEST: "1"
    steps:
      - checkout
      - install_dependencies_unix
      - run:
          name: Validate build environment
          command: |
            set -euo pipefail
            missing=()
            for name in VITE_CONVEX_URL VITE_AI_API_URL; do
              if [[ -z "${!name:-}" ]]; then
                missing+=("$name")
              fi
            done
            if [[ ${#missing[@]} -gt 0 ]]; then
              echo "Missing required build environment values: ${missing[*]}" >&2
              exit 1
            fi
      - run:
          name: Prepare runtime metadata
          command: |
            source "$BASH_ENV"
            bun run prepare:runtime-metadata
      - run:
          name: Sign runtime metadata
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            if [[ -n "${COZEA_RUNTIME_SIGNING_PRIVATE_KEY:-}" || -n "${COZEA_RUNTIME_SIGNING_PRIVATE_KEY_PATH:-}" ]]; then
              bun run sign:runtime-metadata
            else
              echo "Runtime signing key not configured; runtime metadata signatures were not generated."
            fi
      - run:
          name: Typecheck
          command: |
            source "$BASH_ENV"
            bun run typecheck
      - run:
          name: Typecheck electron
          command: |
            source "$BASH_ENV"
            bun run typecheck:electron
      - run:
          name: Lint
          command: |
            source "$BASH_ENV"
            bun run lint
      - run:
          name: Test
          command: |
            source "$BASH_ENV"
            bun run test

  t3_vendor_spike:
    docker:
      - image: cimg/node:22.16
    resource_class: large
    environment:
      CI: "true"
    steps:
      - checkout_with_t3_submodule
      - install_pnpm_unix
      - run:
          name: T3 server boot spike
          command: |
            set -euo pipefail
            node --version
            node scripts/spike-t3-server-boot.mjs

  build_macos_universal:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    environment:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      COZEA_UPDATE_PROVIDER: generic
      COZEA_UPDATER_CHANNEL: latest
      VITE_FF_DATA_ROUTER: "1"
      VITE_FF_VIEW_TRANSITIONS: "1"
      VITE_FF_PRIORITIZED_SCHEDULING: "1"
      VITE_FF_REACT_COMPILER: "1"
      VITE_FF_ROLLDOWN_BUILD: "1"
      VITE_FF_JANK_DIAGNOSTICS: "1"
      VITE_FF_CONTENT_VISIBILITY: "1"
      VITE_FF_OFFSCREEN_SCREENSHOT: "1"
      VITE_FF_UTILITY_PROCESS_MANIFEST: "1"
    steps:
      - checkout
      - run:
          name: Install macOS build dependencies
          command: |
            set -euo pipefail
            brew update
            brew install autoconf
      - install_dependencies_unix
      - run:
          name: Import Developer ID certificate
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            bash scripts/ci/import-macos-certificate.sh
      - run:
          name: Build signed universal macOS release
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            bun run dist -- --mac --universal --publish never
      - run:
          name: Notarize and staple DMG
          command: |
            set -euo pipefail
            bash scripts/ci/notarize-dmgs.sh
      - run:
          name: Verify macOS app signature
          command: |
            set -euo pipefail
            while IFS= read -r app_path; do
              codesign --verify --deep --strict --verbose=2 "$app_path"
              spctl --assess --type execute --verbose=4 "$app_path"
              xcrun stapler validate "$app_path"
            done < <(find dist -maxdepth 4 -type d -name '*.app' ! -path '*/Contents/Frameworks/*')
      - run:
          name: Collect macOS artifacts
          command: |
            set -euo pipefail
            mkdir -p ci-artifacts/macos-universal
            cp -R dist ci-artifacts/macos-universal/dist
      - persist_to_workspace:
          root: .
          paths:
            - ci-artifacts/macos-universal
      - store_artifacts:
          path: dist
          destination: macos-universal

  build_windows_x64:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.large
    environment:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      COZEA_UPDATE_PROVIDER: generic
      COZEA_UPDATER_CHANNEL: latest
      VITE_FF_DATA_ROUTER: "1"
      VITE_FF_VIEW_TRANSITIONS: "1"
      VITE_FF_PRIORITIZED_SCHEDULING: "1"
      VITE_FF_REACT_COMPILER: "1"
      VITE_FF_ROLLDOWN_BUILD: "1"
      VITE_FF_JANK_DIAGNOSTICS: "1"
      VITE_FF_CONTENT_VISIBILITY: "1"
      VITE_FF_OFFSCREEN_SCREENSHOT: "1"
      VITE_FF_UTILITY_PROCESS_MANIFEST: "1"
    steps:
      - checkout
      - run:
          name: Build Windows release
          command: |
            $ErrorActionPreference = "Stop"
            irm bun.sh/install.ps1 | iex
            $env:Path = "$env:USERPROFILE\.bun\bin;$env:Path"
            bun --version
            bun install --frozen-lockfile
            bun run prepare:runtime-metadata
            if ($env:COZEA_RUNTIME_SIGNING_PRIVATE_KEY -or $env:COZEA_RUNTIME_SIGNING_PRIVATE_KEY_PATH) {
              bun run sign:runtime-metadata
            } else {
              Write-Host "Runtime signing key not configured; runtime metadata signatures were not generated."
            }
            bun run dist -- --win --x64 --publish never
            New-Item -ItemType Directory -Force ci-artifacts/windows-x64 | Out-Null
            Copy-Item -Recurse dist ci-artifacts/windows-x64/dist
      - persist_to_workspace:
          root: .
          paths:
            - ci-artifacts/windows-x64
      - store_artifacts:
          path: dist
          destination: windows-x64

  upload_cloudflare_r2:
    executor: linux-node
    environment:
      CI: "true"
      COZEA_UPDATER_CHANNEL: latest
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install_bun_unix
      - run:
          name: Upload release artifacts to Cloudflare R2
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            bash scripts/ci/upload-circleci-artifacts-to-r2.sh

workflows:
  verify:
    jobs:
      - verify:
          context:
            - cozea-release
          filters:
            branches:
              ignore: main
      - t3_vendor_spike:
          filters:
            branches:
              ignore: main

  main-release:
    jobs:
      - verify:
          context:
            - cozea-release
          filters:
            branches:
              only: main
      - t3_vendor_spike:
          filters:
            branches:
              only: main
      - build_macos_universal:
          context:
            - cozea-release
          requires:
            - verify
          filters:
            branches:
              only: main
      - build_windows_x64:
          context:
            - cozea-release
          requires:
            - verify
          filters:
            branches:
              only: main
      - upload_cloudflare_r2:
          context:
            - cozea-release
          requires:
            - build_macos_universal
            - build_windows_x64
          filters:
            branches:
              only: main
