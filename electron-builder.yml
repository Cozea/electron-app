appId: com.cozea.app
productName: Cozea
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/git
    to: git
    filter:
      - '**/*'
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  binaries:
    - Contents/Resources/git/darwin-arm64/bin/git
    - Contents/Resources/git/darwin-x64/bin/git
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - dir
publish:
  provider: github
  owner: 20023136kelyan
  repo: cozea-prod
  releaseType: release
