appId: com.cozea.app
productName: Cozea
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - dir
publish:
  provider: github
  owner: Cozea
  repo: cozea-prod
  releaseType: release
